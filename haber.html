<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
/* Görünüm başlangıcı (beş sayfada aynı). Kayıtlı tema ve dil ilk boyamadan
   önce <html>'e yazılır. Tema kaydı yoksa nitelik de yok, CSS sistem
   tercihini izler; dil kaydı yoksa sayfa Türkçe.
   Depoya her erişim try içinde: panelin önizlemesi bu sayfaları opak kökenli
   bir iframe'de açıyor, orada localStorage'a dokunmak bile hata fırlatıyor.

   Dil: Türkçe metin biçimlendirmede durur (betik yoksa ve tarayıcılar için
   tek kaynak). İngilizcede data-i18n="anahtar" taşıyan öğenin metni,
   data-i18n-nitelik="nitelik:anahtar" taşıyanın niteliği değişir. cevir()
   çubuğun, ilk ekranın ve gövdenin hemen ardından çağrılır; yavaş ağda
   tarayıcı arada boyayabildiği için o ana kadar çevrilmemiş öğe görünmez
   (visibility, yer tutar): İngilizce seçen ziyaretçi Türkçe bir kare görmez,
   gövdenin geri kalanı beklemez. Sınıf DOMContentLoaded'da kalkar. Betiğin ürettiği metin t("anahtar") ile gelir.
   Panelden gelen haberler çevrilmez, Türkçe kalır: tr(öğe) İngilizcede
   öğeye lang="tr" yazar, ekran okuyucu doğru telaffuz etsin. Ortak metin
   burada, sayfanın kendi metni hemen alttaki betikte (atilimai.ekle). */
(function(){
  var h = document.documentElement, t = null, d = null;
  try { t = window.localStorage.getItem("atilimai.tema"); } catch (e) {}
  if (t === "koyu" || t === "acik") h.setAttribute("data-tema", t);
  try { d = window.localStorage.getItem("atilimai.dil"); } catch (e) {}
  var dil = d === "en" ? "en" : "tr";
  if (dil === "en"){
    h.lang = "en";
    h.classList.add("dil-bekle");
    var st = document.createElement("style");
    st.textContent = ".dil-bekle [data-i18n]:not([data-i18n-tamam]){visibility:hidden}";
    document.head.appendChild(st);
    document.addEventListener("DOMContentLoaded", function(){ h.classList.remove("dil-bekle"); });
  }
  var S = {tr: {}, en: {}};
  function ekle(o){
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)){
      if (o[k][0] !== null) S.tr[k] = o[k][0];
      if (o[k][1] !== null) S.en[k] = o[k][1];
    }
  }
  ekle({
    "atla": ["İçeriğe atla", "Skip to content"],
    "yeni-sekme": [" (yeni sekmede açılır)", " (opens in a new tab)"],
    "ayar.ad": [" · Dil ve tema", " · Language and theme"],
    "ayar.dil": ["Dil", "Language"],
    "ayar.tema": ["Tema", "Theme"],
    "ayar.sistem": ["Sistem", "System"],
    "ayar.koyu": ["Koyu", "Dark"],
    "ayar.acik": ["Açık", "Light"],
    "ana-sayfa": ["Ana sayfa", "Home"],
    "haberler": ["Haberler", "News"],
    "katil": ["Topluluğa katıl", "Join the society"],
    "sayi": ["{n}. sayı", "Issue {n}"],
    "sayi-yok": ["Henüz yayımlanmış bir sayı yok.", "No issue has been published yet."],
    "yeniden-dene": ["Yeniden dene", "Try again"],
    "deneniyor": ["Deneniyor…", "Trying…"],
    "devam": ["Devamını oku", "Read more"],
    "kapat": ["Kapat", "Close"],
    "kaynak": ["Kaynak: ", "Source: "],
    "kaynaga-git": ["Kaynağa git", "Go to source"],
    "butun-haberler": ["Bütün haberler", "All news"]
  });
  var AY = {tr: ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],
            en: ["January","February","March","April","May","June","July","August","September","October","November","December"]};
  function metin(k, v){
    var s = S[dil][k]; if (s === undefined) s = S.tr[k]; if (s === undefined) return k;
    return v ? s.replace(/\{(\w+)\}/g, function(_, a){ return v[a] === undefined ? "" : v[a]; }) : s;
  }
  function cevir(kok){
    if (dil !== "en") return;
    kok = kok || document;
    var el = kok.querySelectorAll("[data-i18n]"), i, j, v, p;
    for (i = 0; i < el.length; i++){
      v = S.en[el[i].getAttribute("data-i18n")]; if (v !== undefined) el[i].textContent = v;
      el[i].setAttribute("data-i18n-tamam", "");
    }
    el = kok.querySelectorAll("[data-i18n-nitelik]");
    for (i = 0; i < el.length; i++){
      p = el[i].getAttribute("data-i18n-nitelik").split(";");
      for (j = 0; j < p.length; j++){ var c = p[j].split(":"); v = S.en[c[1]]; if (v !== undefined) el[i].setAttribute(c[0], v); }
    }
  }
  /* Sayı tarihi sözleşmede ISO; haberin kendi tarihi panelden serbest metin, o çevrilmez. */
  function tarih(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? Number(m[3]) + " " + AY[dil][Number(m[2]) - 1] + " " + m[1] : (s || "");
  }
  function tr(el){ if (dil === "en") el.lang = "tr"; return el; }
  /* Geri/ileri önbelleğinden dönen sayfa bırakıldığı temayla ve dille gelir;
     başka sayfada yapılan seçim kayıtta. Dil farklıysa yeniden yükle, tema
     farklıysa niteliği düzelt ve haber ver (alan ve denetim dinliyor). */
  window.addEventListener("pageshow", function(e){
    if (!e.persisted) return;
    var t2 = null, d2 = null;
    try { t2 = window.localStorage.getItem("atilimai.tema"); d2 = window.localStorage.getItem("atilimai.dil"); } catch (x) { return; }
    if ((d2 === "en" ? "en" : "tr") !== dil){ window.location.reload(); return; }
    var yeni = t2 === "koyu" || t2 === "acik" ? t2 : null;
    if (yeni === h.getAttribute("data-tema")) return;
    if (yeni) h.setAttribute("data-tema", yeni); else h.removeAttribute("data-tema");
    var ev; try { ev = new CustomEvent("temadegisti"); } catch (x) { ev = document.createEvent("Event"); ev.initEvent("temadegisti", false, false); }
    document.dispatchEvent(ev);
  });
  window.atilimai = {dil: dil, t: metin, ekle: ekle, cevir: cevir, tarih: tarih, tr: tr, sozluk: S};
})();
</script>
<script>
/* Bu sayfanın metni: [Türkçe, İngilizce]. Türkçesi null olanlar biçimlendirmede
   duruyor; ikisi birden yazılanları betik üretiyor. */
atilimai.ekle({
  "baslik": [null, "News item — Atılım AI"],
  "aciklama": [null, "The full text of an item from the Atılım AI weekly report."],
  "yukleniyor": ["Yazı yükleniyor…", "Loading the article…"],
  "haber": ["Haber", "News item"],

  "d.eksik": ["Adres eksik", "Incomplete address"],
  "d.eksik.m": ["Bu adres hangi haberin açılacağını belirtmiyor. Haberi arşivden açabilirsin.", "This address does not say which item to open. You can open it from the archive."],
  "d.bozuk": ["Adres bozuk", "Broken address"],

  "d.hata.m": ["İnternet bağlantın kesilmiş ya da çok yavaş olabilir.", "Your connection may be down or very slow."],
  "d.yok": ["Haber bulunamadı", "Item not found"],
  "d.yok.m": ["Haber sonradan kaldırılmış ya da sayıdaki yeri değişmiş olabilir. Arşivden yeniden açmayı dene.", "It may have been removed, or its place in the issue may have changed. Try opening it again from the archive."],
  "d.tam": ["Tam metin yok", "No full text"],
  "d.tam.m": ["Bu haber yalnızca özetiyle yayımlandı. Özeti arşivde okuyabilirsin.", "This item was published with a summary only. You can read the summary in the archive."]
});
</script>

<style>
/* Newsreader gelene kadar başlık Georgia'yla diziliyordu ve yazı tipi
   inince satırlar yeniden kırılıyordu (kısılmış ağda CLS 0,059). Yedek yüz

@font-face{font-family:"Newsreader Yedek";src:local("Georgia");font-weight:300;font-style:normal;

@font-face{font-family:"Newsreader Yedek";src:local("Georgia Italic"),local("Georgia-Italic");font-weight:300;font-style:italic;
  size-adjust:86.19%;ascent-override:85.86%;descent-override:30.17%;line-gap-override:0%}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader.woff2) format("woff2");
  font-weight:300 400;font-style:normal;font-display:swap}
@font-face{font-family:"Public Sans";src:url(fonts/public-sans.woff2) format("woff2");
  font-weight:400 500;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/plex-mono-400.woff2) format("woff2");
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/plex-mono-500.woff2) format("woff2");
  font-weight:500;font-style:normal;font-display:swap}
/* Token dışında değer kullanılmaz (DESIGN.md). */
/* Renk: beş sayfada aynı blok (DESIGN.md → Colors). Palet ham değerdir;
   sayfa yüzeyi yalnızca rolleri çağırır. Roller koyu temayla (oda) başlar,
   açık tema (defter) hemen alttaki iki blokta: sistem açıksa ve ziyaretçi
   koyuyu seçmediyse, ya da açığı seçtiyse. Üst çubuk ve menü paneli paleti
   doğrudan kullanır, her temada gece kalır. color-scheme tarayıcının kendi
   çizdiği kaydırma çubuğunu ve denetimleri temayla eşler. */
:root{
  color-scheme:dark;
  /* Palet — gece */
  --gece:#100D0A; --gece-cam:rgba(16,13,10,.86); --tezgah:#191512; --tezgah-2:#211B16;
  --hair:rgba(240,234,221,.13); --hair-s:rgba(240,234,221,.22); --hair-t:rgba(240,234,221,.34);
  --kagit:#F0EADD; --kagit-m:#C4BBAA; --kagit-s:#A69C8C; --kagit-t:#918879;
  --lamba:#E8A33D; --lamba-h:#F5B65C; --on-lamba:#241703; --ekran:#8FB4D6; --canli:#7FB069;
  --lamba-cizgi:rgba(232,163,61,.4);
  /* Palet — gündüz */
  --gunduz:#F2EDE3; --kart:#FBF8F1; --kart-2:#FFFDF9;
  --murekkep:#1A1713; --murekkep-m:#4A443B; --murekkep-s:#6B6357; --murekkep-t:#70685C;
  --lamba-d:#8A5510; --lamba-dh:#6E430B; --ekran-d:#3D6389; --canli-d:#4A7336;
  --murekkep-cizgi:rgba(26,23,19,.14); --murekkep-cizgi-s:rgba(26,23,19,.24); --murekkep-cizgi-t:rgba(26,23,19,.34);
  --lamba-d-cizgi:rgba(138,85,16,.4);
  /* Roller — koyu */
  --zemin:var(--gece); --yuzey:var(--tezgah); --yuzey-2:var(--tezgah-2);
  --metin:var(--kagit); --metin-m:var(--kagit-m); --metin-s:var(--kagit-s); --metin-t:var(--kagit-t);
  --cizgi:var(--hair); --cizgi-s:var(--hair-s); --cizgi-t:var(--hair-t);
  --lamba-iz:var(--lamba); --lamba-iz-h:var(--lamba-h); --lamba-alt:var(--lamba-cizgi);
  --lamba-dolgu:var(--lamba); --lamba-dolgu-h:var(--lamba-h); --lamba-ust:var(--on-lamba);
  --ekran-iz:var(--ekran); --canli-iz:var(--canli);
  --cubuk-zemin:transparent; --cubuk-cam:var(--gece-cam);
  --disp:"Newsreader","Newsreader Yedek",Georgia,serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px;
  --sp-xs:8px; --sp-sm:12px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-xxl:48px;
  --ease:cubic-bezier(.16,1,.3,1);
  /* Üst çubuğun ölçüsü ana sayfanınkiyle aynı (index.html --ray, --ray-ara). */
  --ray:clamp(220px,24vw,420px); --ray-ara:clamp(28px,3.4vw,56px);
}
@media(prefers-color-scheme:light){:root:not([data-tema="koyu"]){
  color-scheme:light;
  --zemin:var(--gunduz); --yuzey:var(--kart); --yuzey-2:var(--kart-2);
  --metin:var(--murekkep); --metin-m:var(--murekkep-m); --metin-s:var(--murekkep-s); --metin-t:var(--murekkep-t);
  --cizgi:var(--murekkep-cizgi); --cizgi-s:var(--murekkep-cizgi-s); --cizgi-t:var(--murekkep-cizgi-t);
  --lamba-iz:var(--lamba-d); --lamba-iz-h:var(--lamba-dh); --lamba-alt:var(--lamba-d-cizgi);
  --lamba-dolgu:var(--lamba-d); --lamba-dolgu-h:var(--lamba-dh); --lamba-ust:var(--kart);
  --ekran-iz:var(--ekran-d); --canli-iz:var(--canli-d);
  --cubuk-zemin:var(--gece); --cubuk-cam:var(--gece);
}}
:root[data-tema="acik"]{
  color-scheme:light;
  --zemin:var(--gunduz); --yuzey:var(--kart); --yuzey-2:var(--kart-2);
  --metin:var(--murekkep); --metin-m:var(--murekkep-m); --metin-s:var(--murekkep-s); --metin-t:var(--murekkep-t);
  --cizgi:var(--murekkep-cizgi); --cizgi-s:var(--murekkep-cizgi-s); --cizgi-t:var(--murekkep-cizgi-t);
  --lamba-iz:var(--lamba-d); --lamba-iz-h:var(--lamba-dh); --lamba-alt:var(--lamba-d-cizgi);
  --lamba-dolgu:var(--lamba-d); --lamba-dolgu-h:var(--lamba-dh); --lamba-ust:var(--kart);
  --ekran-iz:var(--ekran-d); --canli-iz:var(--canli-d);
  --cubuk-zemin:var(--gece); --cubuk-cam:var(--gece);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--zemin);color:var(--metin);font-family:var(--body);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:300}
a{color:var(--lamba-iz);text-decoration:none}
:focus-visible{outline:2px solid var(--lamba-iz);outline-offset:3px;border-radius:var(--r-xs)}
.wrap{max-width:840px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}

.atla{position:absolute;left:-9999px;top:0;z-index:100;background:var(--lamba);color:var(--on-lamba);
  font-weight:500;padding:14px 20px;border-radius:var(--r-md)}
.atla:focus{left:20px;top:14px}
/* Yalnızca ekran okuyucuya söylenen metin. letter-spacing:normal: DESIGN.md, .gizli notu. */
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);
  white-space:nowrap;letter-spacing:normal}
/* Simgeler: index.html'deki çizgi dili (1.5, yuvarlak uç). */
.tanimlar{position:absolute;width:0;height:0;overflow:hidden}
.ok{width:.75em;height:.75em;flex:none;margin-left:.4em;vertical-align:-.06em;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ok.bas{margin-left:0;margin-right:.4em}

/* Üst bar karanlık kalır: odadan çıkıp defteri açma anı. Ölçüsü de odanınki —
   gerekçe haberler.html'deki aynı kuralda. */
.ust{background:var(--gece);border-bottom:1px solid var(--hair)}
.ust .wrap{max-width:1180px;padding-inline:clamp(20px,5vw,56px)}
@media(min-width:1152px){.ust .wrap{max-width:min(calc(1180px + var(--ray) + var(--ray-ara)), 100%)}}
.ust-in{display:flex;align-items:center;gap:var(--sp-md);height:64px}
/* Koyu çubukta odak halkası gecenin lambası: kâğıdın --lamba-d'si burada 3,1:1. */
.ust :focus-visible{outline-color:var(--lamba)}
.marka{display:flex;align-items:center;gap:var(--sp-sm);color:var(--kagit);min-height:44px;
  font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.18em}
/* İşaret maske: beyaz PNG'nin biçimi, rengi marka metninden (currentColor).
   Böylece işaret her zaman yanındaki yazının renginde; ayrı bir koyu varlık
   gerekmiyor. */
.marka i{width:20px;height:20px;flex:none;background:currentColor;
  -webkit-mask:url(images/ai_mark.png) center/contain no-repeat;
  mask:url(images/ai_mark.png) center/contain no-repeat}
.geri{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--kagit-s);
  padding:0 var(--sp-sm);min-height:44px;display:flex;align-items:center;border-radius:var(--r-sm)}
.geri:hover{color:var(--kagit)}
/* 420px altında geri bağlantısı yalnızca oka iner; metni erişilebilir adda
   kalır. 320px'te logo, metinli bağlantı ve görünüm düğmesi 280px'e sığmıyordu.
   Ok tek başına çubukta yüzüyordu: görünüm düğmesinin kutusunu alır, çubuk iki
   kardeş denetim gibi okunur (ana sayfadaki MENÜ + TR gibi). */
@media(max-width:420px){
  .geri{width:44px;height:44px;justify-content:center;padding:0;color:var(--kagit);
    background:var(--tezgah);border:1px solid var(--hair-s);border-radius:var(--r-md);
    transition:background .3s,border-color .3s}
  .geri:hover{background:var(--tezgah-2);border-color:var(--hair-t)}
  .geri .ok.bas{margin-right:0;width:12px;height:12px}
  .geri-yazi{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);
    white-space:nowrap;letter-spacing:normal}
}
/* ---------- görünüm denetimi (dört sayfada aynı) ----------
   Dil ve tema tek düğmenin arkasında: 320px'te iki ayrı 44px düğme okuma
   sayfalarının çubuğuna sığmıyordu. Çubuğun içinde olduğu için her temada
   gece paletiyle çizilir; .menu-btn'in ve mobil menü panelinin dili.
   Betik yoksa düğme gizli kalır: yapılamayacak bir etkileşimi haber vermez. */
.ayar{position:relative;flex:none}
.ayar-btn{display:inline-flex;align-items:center;gap:var(--sp-xs);height:44px;min-width:44px;
  padding:0 var(--sp-sm);background:var(--tezgah);border:1px solid var(--hair-s);border-radius:var(--r-md);
  color:var(--kagit);font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;cursor:pointer;
  transition:background .3s,border-color .3s}
.ayar-btn[hidden]{display:none}
.ayar-btn:hover,.ayar-btn[aria-expanded="true"]{background:var(--tezgah-2);border-color:var(--hair-t)}
.ayar-ikon{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.ayar :focus-visible{outline-color:var(--lamba)}
/* Panel çubuğun alt kenarında açılır: düğme 44px, çubuk 64px, aradaki pay 10px. */
.ayar-panel{position:absolute;top:calc(100% + 10px);right:0;z-index:50;min-width:236px;
  background:var(--tezgah);border:1px solid var(--hair-s);border-radius:var(--r-lg);padding:var(--sp-sm);
  display:flex;flex-direction:column;gap:var(--sp-sm)}
.ayar-panel[hidden],.ayar-grup[hidden]{display:none}
.ayar-ad{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--kagit-t);padding:0 var(--sp-sm);margin-bottom:var(--r-xs)}
.ayar-secenek{display:flex;gap:var(--r-xs)}
/* Seçili seçenek nav'daki etkin bağlantının dilinde: bir yüzey yukarı ve 2px
   lamba alt çizgisi. Durum yalnızca renge dayanmıyor. */
.ayar-secenek button{position:relative;flex:1 1 0;min-height:44px;min-width:44px;padding:0 var(--sp-sm);
  background:transparent;border:0;border-radius:var(--r-sm);color:var(--kagit-s);
  font-family:var(--body);font-size:15px;cursor:pointer;transition:color .3s,background .3s}
.ayar-secenek button:hover{color:var(--kagit);background:var(--tezgah-2)}
.ayar-secenek button[aria-pressed="true"]{color:var(--kagit);background:var(--tezgah-2)}
.ayar-secenek button[aria-pressed="true"]::after{content:"";position:absolute;left:var(--sp-sm);
  right:var(--sp-sm);bottom:8px;height:2px;background:var(--lamba)}
/* Tema değişirken öğeler kendi geçişleriyle farklı hızlarda renk değiştirip
   sayfayı parça parça boyamasın: tek karelik bir sınıf geçişleri bastırır.
   Hareket iptali değil; azaltılmış hareket bloğuyla ilgisi yok. */
.tema-degisiyor *,.tema-degisiyor *::before,.tema-degisiyor *::after{transition:none!important}

.kapak{padding-block:clamp(48px,8vw,80px) var(--sp-xl)}
h1{font-size:clamp(2.75rem,6.4vw,4.6rem);line-height:1.05;letter-spacing:-.02em;
  text-wrap:balance}
/* Panel başlığı 200 karaktere kadar gelebiliyor ve display-xl kısa bir kahraman
   satırı için ölçülmüş bir adım. Tavanda ölçülen: 1440px'te 773px'lik, on
   satırlık bir başlık; yazının ilk paragrafı 1,6 ekran aşağıda (telefonda 2
   ekran). Uzun başlık ramptaki bir alt basamağa iniyor — display-lg; yeni bir
   ölçek uydurulmuyor. Eşik ölçümle seçildi, aşağıdaki betiğe bak. */
h1.uzun{font-size:clamp(2rem,4vw,3rem);line-height:1.1;letter-spacing:-.015em}
/* Panelden gelen başlık, kaynak ve tam metin bölünmez tek bir dizi olabilir.
   Kapak satırı (#kapakMeta) kaynağı da taşıyor, etiket, tarih ve görsel
   açıklaması da panelden geliyor; bunlar listede yokken uç değerlerle 320px'te
   sayfa 1.767px'e açılıyordu. */
h1,.kaynak,.yazi p,.sayac,.etiket,.kapak-ust .tarih,.yazi figcaption{overflow-wrap:anywhere}
.kapak-ust>*{min-width:0}
.giris{color:var(--metin-m);font-size:18px;line-height:1.62;max-width:58ch;margin-top:var(--sp-lg)}
.sayac{font-family:var(--mono);font-size:13px;color:var(--metin-s);margin-top:var(--sp-lg);
  padding-top:var(--sp-md);border-top:1px solid var(--cizgi)}

/* Gövde .wrap taşıyor; alt boşluk kimlikle veriliyor ki .wrap'in padding'i ezmesin
   (DESIGN.md, Shorthand Rule). */
#govde{padding-bottom:clamp(64px,10vw,112px)}

.durum{color:var(--metin-s);font-family:var(--mono);font-size:13px;line-height:1.8;
  margin-top:var(--sp-xl);padding:var(--sp-lg);border:1px solid var(--cizgi);border-radius:var(--r-lg);
  background:var(--yuzey)}
/* Her durum kartının altında bir çıkış satırı: hata da, betiksiz hal de
   bir yere gidebilmeli. Düğmeler zaten .oku — sisteme yeni bir şey girmiyor. */
.durum-eylem{display:flex;gap:var(--sp-sm);flex-wrap:wrap;margin-top:var(--sp-lg)}
/* Betik çalışmıyorsa <noscript> bu bloğu getiriyor; JS açıkken hiç
   oluşturulmadığı için bu kural da hiç uygulanmıyor. .kapak'ın üst boşluğunu
   taşır (padding shorthand'i .wrap üzerinde kullanma kuralı gereği
   padding-block). */
.betiksiz{padding-block:clamp(48px,8vw,80px) 0}
/* Veri gelene kadar tek satır: kapağın üst boşluğunda, gündüz dünyasının
   durum sesiyle (mono 13px, murekkep-s). Yazı gelince yerini kapak alıyor. */
.yukleniyor{padding-block:clamp(48px,8vw,80px) 0;font-family:var(--mono);font-size:13px;
  color:var(--metin-s)}
/* İlk istek uçuştayken gövde ve alt bilgi yerleşimde yok; yükleme satırı
   gövdenin dışında, kapağın yerinde duruyor. Eskiden satır gövdenin içindeydi
   ve yazı gelince kapak gövdenin ÜSTÜNDE açılıyordu: masaüstünde gövde 448px
   aşağı sıçrıyor, alt bilgi ekrandan itiliyordu — ölçülen CLS 0,55 (kötü
   sınırı 0,25). Görünür olmayan öğe kayamaz; geri geldiğinde yeni öğe
   sayılır. Sınıfı betik koyar — betik yoksa ikisi de hep görünür. */
.bekliyor #govde,.bekliyor footer{display:none}
/* Yeniden denemeden sonra odak başlığa ya da sayaca taşınıyor. Bunlar
   etkileşimli değil; halka bir denetim varmış gibi okunurdu. */
[tabindex="-1"]:focus{outline:none}
footer{border-top:1px solid var(--cizgi);padding:var(--sp-xl) 0 var(--sp-xxl)}
.foot{display:flex;gap:var(--sp-lg);flex-wrap:wrap;align-items:baseline;
  font-size:15px;color:var(--metin-s)}
.foot .sag{margin-left:auto;display:flex;gap:var(--sp-lg);flex-wrap:wrap}
/* Telefonda margin-left:auto bağlantıları ekran kenarına sıkıştırıyor ve
   kompozisyondan çok kazara bir kümelenme gibi okunuyor (index.html ile aynı). */
@media(max-width:760px){.foot .sag{margin-left:0}}
/* Satır içi dolgu yerleşimi büyütmez ama dokunma alanını 44 px kuralına çıkarır. */

.foot a:hover{color:var(--metin)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}

     renk ve opaklık geçişleri eylemin karşılığını gösterdiği için kalır. Bu sayfada uzamsal
     geçiş yok; kaldırılacak bir hareket de yok. */
}

.kapak-ust{display:flex;align-items:center;gap:var(--sp-sm);flex-wrap:wrap;margin-bottom:var(--sp-md)}
/* Panelden gelen kategori olduğu gibi basılır: dili belli değil ve lang="tr"

.etiket{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.02em;

.kapak-ust .tarih{font-family:var(--mono);font-size:13px;color:var(--metin-s)}
.yazi{margin-top:var(--sp-xl)}
/* En-boy oranı yeri yüklenmeden ayırır; max-height ile yükseklik yükleme anına
   kadar 0 kalıyor ve görsel gelince altındaki metnin tamamı kayıyordu. */
.yazi img.gorsel{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
  border:1px solid transparent;border-radius:var(--r-lg);margin-bottom:var(--sp-xl)}
.yazi img.gorsel.yuklendi{border-color:var(--cizgi)}
.yazi p{font-family:var(--disp);font-size:19px;line-height:1.85;color:var(--metin);
  margin-top:var(--sp-lg);max-width:66ch}
.yazi p:first-of-type{margin-top:0}
/* Metin arası görsel doğal oranında durur: kapaktaki 16/9 kırpma bir ekran
   görüntüsünü ya da tabloyu okunmaz hâle getirirdi. */
.yazi figure{margin:var(--sp-xl) 0 0;max-width:66ch}
.yazi figure img{width:100%;height:auto;display:block;border-radius:var(--r-lg);
  border:1px solid transparent}
.yazi figure img.yuklendi{border-color:var(--cizgi)}
.yazi figcaption{font-family:var(--mono);font-size:13px;color:var(--metin-s);
  margin-top:var(--sp-sm);line-height:1.5}
.yazi-alt{display:flex;align-items:center;gap:var(--sp-md);flex-wrap:wrap;
  margin-top:var(--sp-xxl);padding-top:var(--sp-lg);border-top:1px solid var(--cizgi)}
.kaynak{font-family:var(--mono);font-size:13px;color:var(--metin-s)}
.oku{font-family:var(--body);font-size:15px;font-weight:500;color:var(--metin);
  background:none;border:1px solid var(--cizgi-s);border-radius:var(--r-md);
  padding:0 var(--sp-md);min-height:44px;display:inline-flex;align-items:center;cursor:pointer;
  transition:background .3s var(--ease),border-color .3s var(--ease)}
.oku:hover{background:var(--yuzey);border-color:var(--metin-s)}
/* Yazı altındaki satırda geri bağlantısı sağa yaslanır. */
.yazi-alt .sona{margin-left:auto}
/* Baskı — bu blok stil sayfasının en sonunda durmak zorunda. Medya sorgusu
   özgüllük eklemez, kaskadı kaynak sırası belirler; blok yukarıda dururken
   .oku (0,1,0) ve .yazi p (0,1,1) gibi eşit özgüllüklü ekran kuralları onu
   yeniyordu ve baskı stili sessizce hiç uygulanmıyordu.

   Yazı 20.000 karaktere kadar çıkabiliyor ve bu, birinin gerçekten
   yazdıracağı tek sayfa. Kroma kâğıtta işi yok. Tarayıcı zeminleri basmaz,
   kart rengi boş bir çerçeveye döner; metin ve çizgi rolleri ise koyu temada
   da gündüz paletine bağlanır, yoksa kâğıda açık gri metin çıkar. */
@media print{
  /* Sabit renk YOK (alfa çizgiler dahil, hepsi palet belirteci): #fff/#000 gibi değerler dedektöre ekran değeri gibi
     görünüp belgeli cream-palette istisnasını maskeliyordu. Ama rol
     belirteçleri gündüz paletine yeniden bağlanıyor: tarayıcı zemini
     basmıyor, metni basıyor; koyu temada yazdırılan sayfa kağıda açık gri
     metinle çıkardı. Blok stil dosyasının sonunda kalmalı (DESIGN.md → Print). */
  :root{--zemin:var(--gunduz); --yuzey:var(--kart); --yuzey-2:var(--kart-2);
    --metin:var(--murekkep); --metin-m:var(--murekkep-m); --metin-s:var(--murekkep-s); --metin-t:var(--murekkep-t);
    --cizgi:var(--murekkep-cizgi); --cizgi-s:var(--murekkep-cizgi-s); --cizgi-t:var(--murekkep-cizgi-t);
    --lamba-iz:var(--lamba-d); --lamba-alt:var(--lamba-d-cizgi); --ekran-iz:var(--ekran-d)}
  /* Kalan kurallar kâğıtta işe yarayan şeyler: kromu kaldır, ölçüyü serbest
     bırak, boş çerçeveyi sil. */
  .ust,footer,.durum-eylem,.oku{display:none}
  .yazi img.gorsel{border:0}
  .wrap{max-width:none;padding:0}
}

<script>
/*
 * Bir haberin tam metni.
 *
 * Adres: haber.html?sayi=12&sira=0 — sayı numarası ve o sayı içindeki sıra.
 * Discord botu da (scripts/discord-gonder.js) aynı şemayla link üretiyor,
 * bu yüzden adres biçimi değiştirilemez.
 *
 * Her şey textContent ile basılır: panelden gelen metin HTML olarak
 * yorumlanmaz.
 */
(function(){
  var kapak    = document.getElementById("kapak");
  var kapakUst = document.getElementById("kapakUst");
  var govde    = document.getElementById("govde");

  function tarihYaz(s){ return window.atilimai.tarih(s); }

  /* Her durum bir sayfa: gerçek bir <h1>, eşleşen sekme başlığı, sade bir
     cümle ve en az bir çıkış. tekrar verilirse çıkış satırının başına bir de
     "Yeniden dene" düğmesi gelir — yalnızca ağ hatasında anlamlı. */
  /* Kapak iskeleti kaldırılmaz, gizlenir. Eskiden remove() ediliyordu ve
     "Yeniden dene" başarılı olduğunda ciz() artık var olmayan öğelere
     yazmaya çalışıp sessizce hataya düşüyor, ziyaretçi aynı hata kartında
     kalıyordu. Gizlerken içerik de temizleniyor: eski bir değer geri
     gelmesin. */
  function gizle(el){ if (!el) return; el.textContent = ""; el.hidden = true; }
  function goster(el){ if (el) el.hidden = false; }

  /* Oklar sayfanın başındaki <symbol>'lerden çağrılır; ekran okuyucu görmez.
     Yeni sekmede açılan bağlantı bunu sözle söyler, ok yerine. */
  function ikon(ad, bas){
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", bas ? "ok bas" : "ok");
    svg.setAttribute("aria-hidden", "true");
    var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#" + ad);
    svg.appendChild(use);
    return svg;
  }
  function yeniSekme(a){
    var g = document.createElement("span");
    g.className = "gizli";
    g.textContent = window.atilimai.t("yeni-sekme");
    if (window.atilimai.dil === "en") g.lang = "en";
    a.appendChild(g);
  }
  function butunHaberler(sinif){
    var a = document.createElement("a");
    a.className = sinif;
    a.href = "haberler.html";
    a.appendChild(ikon("i-geri", true));
    a.appendChild(document.createTextNode(window.atilimai.t("butun-haberler")));
    return a;
  }

  /* Bekleme her çıkışta biter: yazı ya da durum kartı. */
  var bekle = null;
  function bitti(){
    document.body.classList.remove("bekliyor");
    if (bekle && bekle.parentNode) bekle.parentNode.removeChild(bekle);
    bekle = null;
  }

  /* Panel doğruluyor ama dosya elle de düzenlenebiliyor. Sayı olarak gelen bir
     tam metin split() çağrısında patlıyor, hata .catch'e düşüyor ve sayfa
     "Bağlantın kesilmiş olabilir" diyordu — ağ hatası olmayan bir şeyi ağ
     hatası diye, hiç başaramayacak bir "Yeniden dene" ile. Metin alanları
     metne çevrilir; bağlantı alanları href/src'ye girdiği için yalnızca
     http(s) ise kalır — "javascript:" bir bağlantı tıklanınca çalışırdı.
     Aynı süzgeç haberler.html ve index.html'de. */
  function metinAl(v){
    if (typeof v === "string") return v.trim();
    return typeof v === "number" ? String(v) : "";
  }
  function adres(v){
    v = metinAl(v);
    return /^https?:\/\//i.test(v) ? v : "";
  }
  function temizHaber(h){
    if (!h || typeof h !== "object") return null;
    return { etiket: metinAl(h.etiket), tarih: metinAl(h.tarih), baslik: metinAl(h.baslik),
             ozet: metinAl(h.ozet), icerik: metinAl(h.icerik), link: adres(h.link),
             gorsel: adres(h.gorsel), kaynak: metinAl(h.kaynak) };
  }

  /* Sözleşmede kaynak bir ad ("Anthropic"); panel adres de kabul ediyor ve
     1. sayıda iki kaynak da tam adres. Adresin kendisi "Kaynağa git"
     düğmesinde; kapak satırında ve altta alan adı yeter. */
  function kaynakAdi(s){
    if (!/^https?:\/\//i.test(s)) return s;
    try { return new URL(s).hostname.replace(/^www\./, "") || s; }
    catch (e){ return s; }
  }

  /* "Yeniden dene"ye basan kişinin odağı, düğme silindiğinde <body>'ye
     düşüyordu; klavye ve ekran okuyucu kullanıcısı denemenin sonucunu hiç
     duymuyordu. Sonuç çizilince odak oraya taşınır: yeni hata kartındaki
     düğmeye ya da yazının başlığına. */
  var odakIste = false;
  function odakla(el){
    if (!odakIste || !el) return;
    odakIste = false;
    if (!el.matches("a[href],button")) el.tabIndex = -1;
    el.focus();
  }

  function durum(baslik, metin, tekrar){
    bitti();
    document.title = baslik + " — Atılım AI";
    var bas = document.getElementById("baslik");
    bas.textContent = baslik;
    bas.removeAttribute("lang");   /* durum başlığı arayüz dilinde */
    bas.classList.remove("uzun");   /* durum başlıkları kısa */
    gizle(kapakUst);
    gizle(document.getElementById("ozet"));
    gizle(document.getElementById("kapakMeta"));
    kapak.hidden = false;

    /* Yeniden denemede eski kart ekranda kalmasın. */
    govde.textContent = "";

    var p = document.createElement("p");
    p.className = "durum";
    p.textContent = metin;
    govde.appendChild(p);

    var sar = document.createElement("p");
    sar.className = "durum-eylem";
    var dugme = null;
    if (tekrar){
      dugme = document.createElement("button");
      dugme.type = "button";
      dugme.className = "oku";
      dugme.textContent = window.atilimai.t("yeniden-dene");
      /* disabled değil aria-disabled: devre dışı kalan düğme odağı bırakıyor.
         Deneme sürerken kart yerinde kalır, düğme ne olduğunu söyler. */
      dugme.addEventListener("click", function(){
        if (istekVar) return;
        dugme.setAttribute("aria-disabled", "true");
        dugme.textContent = window.atilimai.t("deneniyor");
        odakIste = true;
        tekrar(true);
      });
      sar.appendChild(dugme);
    }
    sar.appendChild(butunHaberler("oku"));
    govde.appendChild(sar);
    odakla(dugme || bas);
  }

  var q = new URLSearchParams(location.search);
  var qSayi = q.get("sayi");
  var qSira = q.get("sira");

  if (qSayi === null || qSayi === "" || qSira === null || qSira === ""){
    durum(window.atilimai.t("d.eksik"), window.atilimai.t("d.eksik.m"));
    return;
  }

  var sayiNo = Number(qSayi);
  var sira   = Number(qSira);

  if (!Number.isInteger(sayiNo) || !Number.isInteger(sira) || sira < 0){
    durum(window.atilimai.t("d.bozuk"), window.atilimai.t("d.bozuk.m"));
    return;
  }

  /* Tek başına bir satırda duran adres = metin arası görsel.
   *
   * Uzantıya BAKMIYORUZ, bilerek: panelden gelen adreslerin bir kısmının
   * yolunda uzantı yok (ör. pbs.twimg.com/media/…?format=png). Görseli çizmeyi
   * deniyoruz; yüklenemezse figür bağlantı paragrafına dönüyor. Aynı kuralın
   * kopyaları: haberler.html, scripts/discord-gonder.js ve paneldeki
   * src/lib/site/news.ts (icerikBloklari). */
  var TEK_ADRES = /^https?:\/\/\S+$/;

  function gorselFigur(src, aciklama){
    var fig = document.createElement("figure");
    var img = document.createElement("img");
    img.src = src;
    img.alt = aciklama || "";
    img.loading = "lazy";
    img.onload = function(){ this.classList.add("yuklendi"); };
    img.onerror = function(){
      var p = document.createElement("p");
      var a = document.createElement("a");
      a.href = src;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = aciklama || src;
      window.atilimai.tr(a);
      yeniSekme(a);
      p.appendChild(a);
      if (fig.parentNode) fig.parentNode.replaceChild(p, fig);
    };
    fig.appendChild(img);
    if (aciklama){
      var yazi = document.createElement("figcaption");
      yazi.textContent = aciklama;
      fig.appendChild(yazi);
    }
    window.atilimai.tr(fig);
    return fig;
  }

  function ciz(sayi, h){
    /* Panel başlığı 200 karaktere kadar gelebiliyor; sekme, yer imi ve
       geçmiş kaydı bunu olduğu gibi taşımasın. Sayfadaki <h1> tam metni
       göstermeye devam ediyor. */
    var sekme = h.baslik || window.atilimai.t("haber");
    if (sekme.length > 70) sekme = sekme.slice(0, 69).replace(/\s+$/, "") + "…";
    document.title = sekme + " — Atılım AI";
    bitti();
    /* Önceki bir hata kartı bunları gizlemiş olabilir. */
    govde.textContent = "";
    goster(kapakUst);
    goster(document.getElementById("kapakMeta"));

    if (h.etiket){
      var et = document.createElement("span");
      et.className = "etiket";
      et.textContent = h.etiket;
      window.atilimai.tr(et);
      kapakUst.appendChild(et);
    }
    if (h.tarih){
      /* <time> değil: panel tarihi serbest metin, datetime üretilemiyor. */
      var tm = document.createElement("span");
      tm.className = "tarih";
      tm.textContent = h.tarih;
      window.atilimai.tr(tm);
      kapakUst.appendChild(tm);
    }

    var bas = document.getElementById("baslik");
    bas.textContent = h.baslik || "";
    window.atilimai.tr(bas);
    /* Karakter sayısı, ölçülen yükseklik değil: eşik deterministik kalsın ve
       yeniden boyutlandırmada ölçüm döngüsü gerekmesin. 70'in üstü her
       kırılma noktasında display-xl'de dört satırı aşıyor. */
    bas.classList.toggle("uzun", (h.baslik || "").length > 70);

    var ozet = document.getElementById("ozet");
    /* Kaldırılmaz, gizlenir: iskeleti silmek yeniden denemeyi kırıyordu. */
    window.atilimai.tr(ozet);
    if (h.ozet){ ozet.textContent = h.ozet; ozet.hidden = false; } else gizle(ozet);

    /* Sayı ve tarih arayüz dilinde; kaynak adı panelden gelir. İngilizcede
       satırın sonu haberlerin Türkçe olduğunu söyler. */
    var meta = document.getElementById("kapakMeta");
    meta.textContent = window.atilimai.t("sayi", {n: sayi.sayi}) + " · " + tarihYaz(sayi.tarih) + (h.kaynak ? " · " : "");
    if (h.kaynak) meta.appendChild(window.atilimai.tr(document.createElement("span"))).textContent = kaynakAdi(h.kaynak);
    meta.appendChild(document.createTextNode(window.atilimai.t("meta.dil")));

    kapak.hidden = false;

    var yazi = document.createElement("article");
    yazi.className = "yazi";
    /* Başlık kapakta, yazının dışında; bölge adını ondan alsın. */
    yazi.setAttribute("aria-labelledby", "baslik");

    if (h.gorsel){
      var img = document.createElement("img");
      img.className = "gorsel";
      img.src = h.gorsel;
      img.alt = "";
      img.onload = function(){ this.classList.add("yuklendi"); };
      img.onerror = function(){ if (this.parentNode) this.parentNode.removeChild(this); };
      yazi.appendChild(img);
    }

    /* Boş satır paragrafı ayırır; tek satır sonları paragraf içinde kalır.
       İlk satırı tek başına adres olan blok, metin arası görsel olur. */
    (h.icerik || "").split(/\n\s*\n/).forEach(function(parca){
      var metin = parca.replace(/\s+$/, "");
      if (!metin) return;
      var satirlar = metin.split("\n");
      var ilk = satirlar[0].trim();
      if (TEK_ADRES.test(ilk)){
        yazi.appendChild(gorselFigur(ilk, satirlar.slice(1).join("\n").trim()));
        return;
      }
      var p = document.createElement("p");
      p.textContent = metin;
      window.atilimai.tr(p);
      yazi.appendChild(p);
    });

    var alt = document.createElement("div");
    alt.className = "yazi-alt";
    if (h.kaynak){
      var k = document.createElement("span");
      k.className = "kaynak";
      k.textContent = window.atilimai.t("kaynak");
      k.appendChild(window.atilimai.tr(document.createElement("span"))).textContent = kaynakAdi(h.kaynak);
      alt.appendChild(k);
    }
    if (h.link){
      var oku = document.createElement("a");
      oku.className = "oku";
      oku.href = h.link;
      oku.target = "_blank";
      oku.rel = "noopener noreferrer";
      oku.textContent = window.atilimai.t("kaynaga-git");
      oku.appendChild(ikon("i-dis"));
      yeniSekme(oku);
      alt.appendChild(oku);
    }
    alt.appendChild(butunHaberler("oku sona"));
    yazi.appendChild(alt);

    govde.appendChild(yazi);
    odakla(bas);
  }

  /* Uçuştaki istek varken ikinci dokunuş iki kart üst üste bindirmesin.

     Bu sayfanın yükleniyor hâli yoktu: veri gelene kadar gezinme çubuğuyla
     alt bilgi arasında boş bir sayfa duruyordu — Discord'daki bağlantıdan
     telefonla gelen okurun ilk gördüğü şey. Bağlantı kopmadan donan bir ağda
     da bu boşluk hiç bitmiyordu. Şimdi bir satır ne olduğunu söylüyor; yanıtın
     ilk baytı ZAMAN_ASIMI içinde gelmezse hata kartı çizilir. fetch'e
     AbortSignal verilmiyor (haberler.html ile aynı gerekçe, panel önizlemesi
     window.fetch'i sarmalıyor); geç gelen yanıt yine de çizilir, sonIstek
     yalnızca yerini yeni bir denemeye bırakmış eski isteği susturur. */
  var ZAMAN_ASIMI = 10000;
  var istekVar = false, sonIstek = 0;
  function getir(yeniden){
    if (istekVar) return;
    istekVar = true;
    var no = ++sonIstek, dustu = false;
    if (!yeniden){
      govde.textContent = "";
      bekle = document.createElement("p");
      bekle.className = "yukleniyor wrap";
      bekle.textContent = window.atilimai.t("yukleniyor");
      govde.parentNode.insertBefore(bekle, govde);
      document.body.classList.add("bekliyor");
    }
    function dusur(){
      istekVar = false;
      durum(window.atilimai.t("d.hata"), window.atilimai.t("d.hata.m"),
            getir);
    }
    var sure = setTimeout(function(){
      if (no !== sonIstek) return;
      dustu = true; dusur();
    }, ZAMAN_ASIMI);

    fetch("content/haberler.json", { cache: "no-cache" })
    .then(function(r){ clearTimeout(sure); if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      if (no !== sonIstek) return;
      istekVar = false;
      var sayilar = Array.isArray(d && d.sayilar) ? d.sayilar : [];
      var sayi = null;
      for (var i = 0; i < sayilar.length; i++){
        if (sayilar[i] && Number(sayilar[i].sayi) === sayiNo){ sayi = sayilar[i]; break; }
      }
      var h = sayi && Array.isArray(sayi.haberler) ? temizHaber(sayi.haberler[sira]) : null;
      if (!h){
        durum(window.atilimai.t("d.yok"), window.atilimai.t("d.yok.m"));
        return;
      }
      if (!h.icerik){
        durum(window.atilimai.t("d.tam"), window.atilimai.t("d.tam.m"));
        return;
      }
      ciz(sayi, h);
    })
    /* Eskiden buradaki cümle ziyaretçiye yerel bir HTTP sunucusu kurmasını
       söylüyordu — geliştirici talimatıydı ve bağlantısı kopan öğrenciye
       hiçbir şey anlatmıyordu. index.html aynı dosyayı okuyor ve bunu doğru
       yapıyor; kalıp oradan geliyor. */
    .catch(function(){
      clearTimeout(sure);
      if (no !== sonIstek || dustu) return;
      dusur();
    });
  }

  getir();
})();
</script>
<script>
/* ============================================================
   Görünüm denetimi (dört sayfada aynı: index, haberler, haber, katil)

   Tema canlı değişir: <html data-tema> ve kayıt. "Sistem" niteliği ve
   kaydı kaldırır; CSS o zaman prefers-color-scheme'i izler. Dil değişince
   sayfa yeniden yüklenir: her sayfanın betiği metnini tek dilde üretiyor,
   açık kart ve odak gibi durumları canlı yeniden çizmek yerine yükleme
   temiz bir sayfa veriyor. Odak yüklemeden sonra düğmeye döner, kaydırma
   konumunu tarayıcı korur. Depo kullanılamıyorsa (panelin önizlemesi)
   tema oturum boyunca çalışır, dil satırı gizlenir: yükleme seçimi
   taşıyamaz.
   ============================================================ */
(function(){
  "use strict";
  var h = document.documentElement;
  var btn = document.getElementById("ayarBtn");
  var panel = document.getElementById("ayarPanel");
  if (!btn || !panel) return;
  var kutu = btn.parentNode;
  var TEMA = "atilimai.tema", DIL = "atilimai.dil", ODAK = "atilimai.odak";
  var acikSistem = window.matchMedia("(prefers-color-scheme: light)");

  function yaz(k, v){ try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  var depoVar = yaz("atilimai.deneme", "1") && yaz("atilimai.deneme", null);

  function secim(){ var t = h.getAttribute("data-tema"); return t === "koyu" || t === "acik" ? t : "sistem"; }
  function etkin(){ var t = secim(); return t === "sistem" ? (acikSistem.matches ? "acik" : "koyu") : t; }
  var dil = h.lang === "en" ? "en" : "tr";

  function guncelle(){
    btn.querySelector(".ayar-kod").textContent = dil.toUpperCase();
    btn.querySelector("use").setAttribute("href", etkin() === "acik" ? "#i-gunes" : "#i-ay");
    var t = secim();
    [].forEach.call(panel.querySelectorAll("[data-tema-sec]"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-tema-sec") === t ? "true" : "false"); });
    [].forEach.call(panel.querySelectorAll("[data-dil-sec]"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-dil-sec") === dil ? "true" : "false"); });
  }
  function haberVer(){
    var e; try { e = new CustomEvent("temadegisti"); } catch (x) { e = document.createEvent("Event"); e.initEvent("temadegisti", false, false); }
    document.dispatchEvent(e);
  }
  function temaUygula(t){
    h.classList.add("tema-degisiyor");
    if (t === "sistem") h.removeAttribute("data-tema"); else h.setAttribute("data-tema", t);
    yaz(TEMA, t === "sistem" ? null : t);
    guncelle();
    void getComputedStyle(document.body).backgroundColor;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ h.classList.remove("tema-degisiyor"); }); });
    haberVer();
  }
  function ac(){ panel.hidden = false; btn.setAttribute("aria-expanded", "true"); }
  function kapat(odakla){
    if (panel.hidden) return;
    panel.hidden = true; btn.setAttribute("aria-expanded", "false");
    if (odakla) btn.focus();
  }

  btn.addEventListener("click", function(){ if (panel.hidden) ac(); else kapat(false); });
  panel.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    var t = b.getAttribute("data-tema-sec"), d = b.getAttribute("data-dil-sec");
    if (t) temaUygula(t);
    if (d && d !== dil && yaz(DIL, d === "en" ? "en" : null)) {
      try { window.sessionStorage.setItem(ODAK, "ayar"); } catch (x) {}
      window.location.reload();
    }
  });
  /* Dışarı dokunmak kapatır (ana sayfada mobil menü de aynı kuralla kapanıyor,
     ikisi birbirini kendiliğinden kapatır). Escape kapatıp odağı düğmeye verir.
     Odak denetimden çıkınca kapanır; relatedTarget yoksa (Safari düğmeye
     tıklayınca odağı taşımıyor) karar dışarı dokunmaya kalır. */
  document.addEventListener("click", function(e){ if (!kutu.contains(e.target)) kapat(false); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !panel.hidden) kapat(true); });
  kutu.addEventListener("focusout", function(e){ if (e.relatedTarget && !kutu.contains(e.relatedTarget)) kapat(false); });
  var dinle = function(){ guncelle(); if (secim() === "sistem") haberVer(); };
  document.addEventListener("temadegisti", guncelle);
  if (acikSistem.addEventListener) acikSistem.addEventListener("change", dinle); else acikSistem.addListener(dinle);

  if (!depoVar) document.getElementById("ayarDil").hidden = true;
  guncelle();
  btn.hidden = false;
  try { if (window.sessionStorage.getItem(ODAK) === "ayar") { window.sessionStorage.removeItem(ODAK); btn.focus(); } } catch (x) {}
})();
</script>
</body>
