<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haberler — Atılım AI</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#070A14;
  --line:rgba(146,170,235,.14);
  --line-hi:rgba(146,170,235,.32);
  --ink:#E9EDF8;
  --dim:#8792AE;
  --dim-hi:#B9C2DE;
  --blue:#3D6BFF;
  --blue-soft:#8DA4FF;
  --red:#E63A4B;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--void);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
/* üstteki yumuşak ışık — sabit, hafif, hiçbir şeyi tıklanmaz yapmıyor */
body::before{
  content:"";position:fixed;left:0;right:0;top:0;height:560px;pointer-events:none;z-index:0;
  background:radial-gradient(58% 100% at 50% 0%,rgba(61,107,255,.15),transparent 72%);
}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 clamp(1.25rem,5vw,2.5rem);position:relative;z-index:1}

/* ---------- üst bar ---------- */
.topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
  background:rgba(7,10,20,.78);backdrop-filter:blur(14px)}
.topbar-in{display:flex;align-items:center;gap:16px;height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);
  font-family:var(--display);font-weight:500;font-size:13.5px;letter-spacing:.14em}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--red);display:block;flex:none}
.geri{margin-left:auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;
  transition:color .3s,border-color .3s,background .3s}
.geri:hover{color:var(--ink);border-color:var(--line-hi);background:rgba(61,107,255,.08)}

/* ---------- kapak ---------- */
.hero{padding:clamp(52px,9vw,88px) 0 clamp(30px,5vw,46px)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--blue-soft);display:flex;align-items:center;gap:12px;margin-bottom:22px}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--blue);flex:none}
h1{font-family:var(--display);font-weight:500;font-size:clamp(2.3rem,7vw,3.6rem);letter-spacing:-.035em;line-height:1.05}
.lead{color:var(--dim-hi);max-width:54ch;margin-top:20px;font-size:1.02rem}
.hero-meta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}

/* ---------- sayı başlığı ---------- */
main.wrap{padding-bottom:clamp(70px,10vw,120px)}
.sayi{margin-top:clamp(30px,5vw,44px)}
.sayi-bar{position:sticky;top:58px;z-index:10;display:flex;align-items:baseline;gap:14px;
  padding:14px 0;background:rgba(7,10,20,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sayi-bar h2{font-family:var(--display);font-weight:500;font-size:1.15rem;letter-spacing:-.02em}
.sayi-bar time{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--dim);margin-left:auto}

/* ---------- haber ---------- */
.akis{display:flex;flex-direction:column;gap:20px;margin-top:24px}
.haber{border-radius:16px;border:1px solid var(--line);background:rgba(12,17,34,.6);
  overflow:hidden;transition:border-color .4s,background .4s}
.haber:hover{border-color:var(--line-hi);background:rgba(12,17,34,.78)}
.haber img{width:100%;max-height:300px;object-fit:cover;display:block;border-bottom:1px solid var(--line)}
.haber-in{padding:clamp(22px,3.5vw,30px)}
.haber-ust{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.etiket{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--blue-soft);border:1px solid var(--line-hi);border-radius:999px;padding:4px 11px}
.haber-ust time{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.haber h3{font-family:var(--display);font-weight:500;font-size:clamp(1.15rem,2.6vw,1.42rem);
  letter-spacing:-.02em;line-height:1.28;margin-top:14px}
.haber h3 a{color:inherit;text-decoration:none;transition:color .3s}
.haber h3 a:hover{color:var(--blue-soft)}
.ozet{color:var(--dim-hi);margin-top:14px;font-size:.98rem;line-height:1.75}
.haber-alt{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.kaynak{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.oku{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:500;text-decoration:none;
  color:var(--ink);border:1px solid var(--line-hi);border-radius:8px;padding:9px 16px;
  transition:border-color .3s,background .3s,transform .3s}
.oku:hover{border-color:var(--blue-soft);background:rgba(61,107,255,.08);transform:translateY(-2px)}

/* ---------- açılır kart ---------- */
.haber.acilir .haber-in{cursor:pointer}
.haber.acilir h3{transition:color .3s}
.haber.acilir:hover h3{color:var(--blue-soft)}
.ac{margin-left:auto;font-family:var(--body);font-size:13px;font-weight:500;
  color:var(--ink);background:none;border:1px solid var(--line-hi);border-radius:8px;
  padding:9px 16px;cursor:pointer;transition:border-color .3s,background .3s}
.ac:hover{border-color:var(--blue-soft);background:rgba(61,107,255,.08)}
.tam{display:none;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
.haber.acik .tam{display:block}
.tam p{color:var(--dim-hi);font-size:.98rem;line-height:1.8;margin-top:16px}
.tam p:first-child{margin-top:0}
.tam .kalici{display:inline-block;margin-top:22px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-decoration:none;
  border-bottom:1px solid var(--line-hi);padding-bottom:3px;transition:color .3s}
.tam .kalici:hover{color:var(--ink)}

/* ---------- durum / alt ---------- */
.durum{color:var(--dim);font-family:var(--mono);font-size:12.5px;line-height:1.8;
  margin-top:40px;padding:22px 24px;border:1px solid var(--line);border-radius:14px}
footer{border-top:1px solid var(--line);padding:26px 0;margin-top:0}
.footer-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--dim)}
.footer-in a{color:var(--dim);text-decoration:none;transition:color .3s}
.footer-in a:hover{color:var(--ink)}
.footer-in .sag{margin-left:auto;display:flex;gap:18px}

:focus-visible{outline:2px solid var(--blue-soft);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .oku:hover{transform:none}
}
</style>
</head>
<body>

<nav class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="index.html"><i></i>ATILIM AI</a>
    <a class="geri" href="index.html">← Ana sayfa</a>
  </div>
</nav>

<header class="hero wrap">
  <p class="eyebrow">Haftalık Rapor</p>
  <h1>Haberler</h1>
  <p class="lead">Her Pazartesi derlediğimiz yapay zekâ gelişmelerinin tam arşivi — ana sayfadaki özetlerin kaynakları, görselleri ve ayrıntılarıyla.</p>
  <p class="hero-meta" id="heroMeta">Arşiv yükleniyor…</p>
</header>

<main class="wrap" id="liste"></main>

<footer>
  <div class="wrap footer-in">
    <span>Atılım AI · Ankara</span>
    <span class="sag">
      <a href="index.html">Ana sayfa</a>
      <a href="https://discord.gg/uUzsA7uDzU" target="_blank" rel="noopener">Discord</a>
    </span>
  </div>
</footer>

<script>
(function(){
  var liste    = document.getElementById("liste");
  var heroMeta = document.getElementById("heroMeta");

  var AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran",
               "Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

  /* "2026-08-03" → "3 Ağustos 2026"; tanınmayan biçim olduğu gibi döner */
  function tarihYaz(s){
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!p) return s || "";
    return Number(p[3]) + " " + AYLAR[Number(p[2]) - 1] + " " + p[1];
  }

  function durum(metin){
    var p = document.createElement("p");
    p.className = "durum";
    p.textContent = metin;
    liste.appendChild(p);
  }

  /* Haberin tam metni varsa ayrıntı sayfasının adresi, yoksa boş. */
  function ayrintiAdresi(h, sayiNo, sira){
    if (!h.icerik) return "";
    return "haber.html?sayi=" + encodeURIComponent(sayiNo) + "&sira=" + sira;
  }

  /* Tam metni paragraflara böler: boş satır ayırır, tek satır sonu ayırmaz. */
  function paragraflar(metin){
    var kap = document.createDocumentFragment();
    (metin || "").split(/\n\s*\n/).forEach(function(parca){
      var t = parca.replace(/\s+$/, "");
      if (!t) return;
      var p = document.createElement("p");
      p.textContent = t;
      kap.appendChild(p);
    });
    return kap;
  }

  function haberKarti(h, sayiNo, sira){
    var ayrinti = ayrintiAdresi(h, sayiNo, sira);
    var art = document.createElement("article");
    art.className = ayrinti ? "haber acilir" : "haber";

    if (h.gorsel){
      var img = document.createElement("img");
      img.src = h.gorsel;
      img.alt = "";
      img.loading = "lazy";
      art.appendChild(img);
    }

    var ic = document.createElement("div");
    ic.className = "haber-in";

    var ust = document.createElement("div");
    ust.className = "haber-ust";
    if (h.etiket){
      var et = document.createElement("span");
      et.className = "etiket";
      et.textContent = h.etiket;
      ust.appendChild(et);
    }
    if (h.tarih){
      var tm = document.createElement("time");
      tm.textContent = h.tarih;
      ust.appendChild(tm);
    }
    if (ust.children.length) ic.appendChild(ust);

    /* Tam metni olan haberde başlık bağlantı değil: karta tıklamak metni
       yerinde açıyor. Tam metin yoksa eski davranış sürer, başlık doğrudan
       kaynağa gider. */
    var h3 = document.createElement("h3");
    if (ayrinti){
      h3.textContent = h.baslik || "";
    } else if (h.link){
      var a = document.createElement("a");
      a.href = h.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = h.baslik || "";
      h3.appendChild(a);
    } else {
      h3.textContent = h.baslik || "";
    }
    ic.appendChild(h3);

    if (h.ozet){
      var p = document.createElement("p");
      p.className = "ozet";
      p.textContent = h.ozet;
      ic.appendChild(p);
    }

    if (h.kaynak || h.link || ayrinti){
      var alt = document.createElement("div");
      alt.className = "haber-alt";
      if (h.kaynak){
        var k = document.createElement("span");
        k.className = "kaynak";
        k.textContent = "Kaynak: " + h.kaynak;
        alt.appendChild(k);
      }
      /* Dış kaynak varsa ikisi de durur: biri yazının tamamı, öteki kaynak. */
      if (h.link){
        var oku = document.createElement("a");
        oku.className = "oku";
        oku.href = h.link;
        oku.target = "_blank";
        oku.rel = "noopener noreferrer";
        oku.textContent = "Haberi oku ↗";
        alt.appendChild(oku);
      }
      if (ayrinti){
        var dugme = document.createElement("button");
        dugme.type = "button";
        dugme.className = "ac";
        dugme.textContent = "Devamını oku ▾";
        dugme.setAttribute("aria-expanded", "false");
        if (h.link) dugme.style.marginLeft = "0";
        alt.appendChild(dugme);
      }
      ic.appendChild(alt);
    }

    if (ayrinti){
      var tam = document.createElement("div");
      tam.className = "tam";
      tam.appendChild(paragraflar(h.icerik));

      /* Kalıcı bağlantı: haberi tek başına paylaşmak isteyen için. */
      var kalici = document.createElement("a");
      kalici.className = "kalici";
      kalici.href = ayrinti;
      kalici.textContent = "Bu haberi ayrı sayfada aç ↗";
      tam.appendChild(kalici);

      ic.appendChild(tam);

      /* Tek dinleyici kartta: düğmeye tıklamak da buraya kabarıyor. Kaynak
         bağlantıları hariç tutuluyor, yoksa yeni sekme açarken kart da
         açılıp kapanıyordu. */
      art.addEventListener("click", function(olay){
        if (olay.target.closest("a")) return;
        var acik = art.classList.toggle("acik");
        var d = art.querySelector(".ac");
        if (d){
          d.textContent = acik ? "Kapat ▴" : "Devamını oku ▾";
          d.setAttribute("aria-expanded", acik ? "true" : "false");
        }
      });
    }

    art.appendChild(ic);
    return art;
  }

  function sayiBolumu(sayi){
    var sec = document.createElement("section");
    sec.className = "sayi";

    var bar = document.createElement("div");
    bar.className = "sayi-bar";

    var h2 = document.createElement("h2");
    h2.textContent = sayi.sayi + ". sayı";
    bar.appendChild(h2);

    var t = document.createElement("time");
    t.textContent = tarihYaz(sayi.tarih);
    bar.appendChild(t);

    sec.appendChild(bar);

    var akis = document.createElement("div");
    akis.className = "akis";
    (sayi.haberler || []).forEach(function(h, i){ akis.appendChild(haberKarti(h, sayi.sayi, i)); });
    sec.appendChild(akis);

    return sec;
  }

  if (!window.fetch){
    heroMeta.textContent = "";
    durum("Tarayıcınız bu sayfayı desteklemiyor.");
    return;
  }

  fetch("content/haberler.json", { cache: "no-cache" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      var sayilar = (d && d.sayilar) || [];
      if (!sayilar.length){
        heroMeta.textContent = "";
        durum("Henüz yayımlanmış bir sayı yok.");
        return;
      }

      var toplam = 0;
      sayilar.forEach(function(s){ toplam += (s.haberler || []).length; });
      heroMeta.textContent = sayilar.length + " sayı · " + toplam + " haber · en yenisi " +
                             tarihYaz(sayilar[0].tarih);

      sayilar.forEach(function(s){ liste.appendChild(sayiBolumu(s)); });
    })
    .catch(function(){
      heroMeta.textContent = "";
      durum("Haberler yüklenemedi. Bu sayfa haberleri content/haberler.json dosyasından okur; " +
            "dosyayı doğrudan açmak yerine yerel bir sunucu (http://) üzerinden açmanız gerekir.");
    });
})();
</script>
</body>
</html>
