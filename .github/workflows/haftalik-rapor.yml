name: Haftalık raporu Discord'a gönder

on:
  push:
    branches: [main]
    paths:
      - "content/haberler.json"
  workflow_dispatch:        # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write           # .son-gonderilen dosyasını geri commit edebilmek için

concurrency:
  group: discord-rapor
  cancel-in-progress: false

jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Discord'a gönder
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SITE_URL: https://atilimai.github.io/Atilim_AI_Web/
        run: node scripts/discord-gonder.js

      - name: Gönderim durumunu kaydet
        run: |
          if [[ -n "$(git status --porcelain content/.son-gonderilen)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/.son-gonderilen
            git commit -m "Discord: son gönderilen sayı güncellendi [skip ci]"
            git push
          fi
