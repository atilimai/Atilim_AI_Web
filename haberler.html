<script>
/* Görünüm başlangıcı (beş sayfada aynı). Kayıtlı tema ve dil ilk boyamadan
   önce <html>'e yazılır. Tema kaydı yoksa nitelik de yok, CSS sistem
   tercihini izler; dil kaydı yoksa sayfa Türkçe.
   Depoya her erişim try içinde: panelin önizlemesi bu sayfaları opak kökenli
   bir iframe'de açıyor, orada localStorage'a dokunmak bile hata fırlatıyor. */
(function(){
  var t = null;
  try { t = window.localStorage.getItem("atilimai.tema"); } catch (e) {}
  if (t === "koyu" || t === "acik") document.documentElement.setAttribute("data-tema", t);
  var d = null;
  try { d = window.localStorage.getItem("atilimai.dil"); } catch (e) {}
  if (d === "en") document.documentElement.lang = "en";
})();
</script>

/* Token dışında değer kullanılmaz (DESIGN.md). */
/* Renk: beş sayfada aynı blok (DESIGN.md → Colors). Palet ham değerdir;
   sayfa yüzeyi yalnızca rolleri çağırır. Roller koyu temayla (oda) başlar,
   açık tema (defter) hemen alttaki iki blokta: sistem açıksa ve ziyaretçi
   koyuyu seçmediyse, ya da açığı seçtiyse. Üst çubuk ve menü paneli paleti
   doğrudan kullanır, her temada gece kalır. color-scheme tarayıcının kendi
   çizdiği kaydırma çubuğunu ve denetimleri temayla eşler. */
:root{
  color-scheme:dark;
  /* Palet — gece */
  --gece:#100D0A; --gece-cam:rgba(16,13,10,.86); --tezgah:#191512; --tezgah-2:#211B16;
  --hair:rgba(240,234,221,.13); --hair-s:rgba(240,234,221,.22); --hair-t:rgba(240,234,221,.34);
  --kagit:#F0EADD; --kagit-m:#C4BBAA; --kagit-s:#A69C8C; --kagit-t:#918879;
  --lamba:#E8A33D; --lamba-h:#F5B65C; --on-lamba:#241703; --ekran:#8FB4D6; --canli:#7FB069;
  /* Palet — gündüz */
  --gunduz:#F2EDE3; --kart:#FBF8F1; --kart-2:#FFFDF9;
  --murekkep:#1A1713; --murekkep-m:#4A443B; --murekkep-s:#6B6357; --murekkep-t:#70685C;
  --lamba-d:#8A5510; --lamba-dh:#6E430B; --ekran-d:#3D6389; --canli-d:#4A7336;
  /* Roller — koyu */
  --zemin:var(--gece); --yuzey:var(--tezgah); --yuzey-2:var(--tezgah-2);
  --metin:var(--kagit); --metin-m:var(--kagit-m); --metin-s:var(--kagit-s); --metin-t:var(--kagit-t);
  --cizgi:var(--hair); --cizgi-s:var(--hair-s); --cizgi-t:var(--hair-t);
  --lamba-iz:var(--lamba); --lamba-iz-h:var(--lamba-h); --lamba-alt:rgba(232,163,61,.4);
  --lamba-dolgu:var(--lamba); --lamba-dolgu-h:var(--lamba-h); --lamba-ust:var(--on-lamba);
  --ekran-iz:var(--ekran); --canli-iz:var(--canli);
  --cubuk-zemin:transparent;
  --disp:"Newsreader",Georgia,serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px;
  --sp-xs:8px; --sp-sm:12px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-xxl:48px;
  --ease:cubic-bezier(.16,1,.3,1);
  /* Üst çubuğun ölçüsü ana sayfanınkiyle aynı (index.html --ray, --ray-ara). */
  --ray:clamp(220px,24vw,420px); --ray-ara:clamp(28px,3.4vw,56px);
}
@media(prefers-color-scheme:light){:root:not([data-tema="koyu"]){
  color-scheme:light;
  --zemin:var(--gunduz); --yuzey:var(--kart); --yuzey-2:var(--kart-2);
  --metin:var(--murekkep); --metin-m:var(--murekkep-m); --metin-s:var(--murekkep-s); --metin-t:var(--murekkep-t);
  --cizgi:rgba(26,23,19,.14); --cizgi-s:rgba(26,23,19,.24); --cizgi-t:rgba(26,23,19,.34);
  --lamba-iz:var(--lamba-d); --lamba-iz-h:var(--lamba-dh); --lamba-alt:rgba(138,85,16,.4);
  --lamba-dolgu:var(--lamba-d); --lamba-dolgu-h:var(--lamba-dh); --lamba-ust:var(--kart);
  --ekran-iz:var(--ekran-d); --canli-iz:var(--canli-d);
  --cubuk-zemin:var(--gece);
}}
:root[data-tema="acik"]{
  color-scheme:light;
  --zemin:var(--gunduz); --yuzey:var(--kart); --yuzey-2:var(--kart-2);
  --metin:var(--murekkep); --metin-m:var(--murekkep-m); --metin-s:var(--murekkep-s); --metin-t:var(--murekkep-t);
  --cizgi:rgba(26,23,19,.14); --cizgi-s:rgba(26,23,19,.24); --cizgi-t:rgba(26,23,19,.34);
  --lamba-iz:var(--lamba-d); --lamba-iz-h:var(--lamba-dh); --lamba-alt:rgba(138,85,16,.4);
  --lamba-dolgu:var(--lamba-d); --lamba-dolgu-h:var(--lamba-dh); --lamba-ust:var(--kart);
  --ekran-iz:var(--ekran-d); --canli-iz:var(--canli-d);
  --cubuk-zemin:var(--gece);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--zemin);color:var(--metin);font-family:var(--body);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:300}
a{color:var(--lamba-iz);text-decoration:none}
:focus-visible{outline:2px solid var(--lamba-iz);outline-offset:3px;border-radius:var(--r-xs)}
.wrap{max-width:840px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}
.mono{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}

.atla{position:absolute;left:-9999px;top:0;z-index:100;background:var(--lamba);color:var(--on-lamba);
  font-weight:500;padding:14px 20px;border-radius:var(--r-md)}
.atla:focus{left:20px;top:14px}
/* Yalnızca ekran okuyucuya söylenen metin. letter-spacing:normal: DESIGN.md, .gizli notu. */
.gizli{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);
  white-space:nowrap;letter-spacing:normal}
/* Simgeler: index.html'deki çizgi dili (1.5, yuvarlak uç). Oklar eskiden metin
   karakteriydi ve yazı tiplerinde yoktular; sistem yazı tipinden çiziliyorlardı. */
.tanimlar{position:absolute;width:0;height:0;overflow:hidden}
.ok{width:.75em;height:.75em;flex:none;margin-left:.4em;vertical-align:-.06em;
  fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ok.bas{margin-left:0;margin-right:.4em}

/* Üst bar karanlık kalır: odadan çıkıp defteri açma anı. Ölçüsü de odanınki:
   ana sayfanın menüsüyle aynı yükseklik, aynı kap, aynı kenar boşluğu. Eskiden
   840px'lik okuma kabındaydı ve 1440px'te sayfa değişince logo 56px'ten 338px'e
   kayıyor, çubuk 4px kısalıyordu — iki ayrı site gibi. Okuma ölçüsü içeriğin,
   krom onu taşımaz. */
.ust{background:var(--gece);border-bottom:1px solid var(--hair)}
.ust .wrap{max-width:1180px;padding-inline:clamp(20px,5vw,56px)}
@media(min-width:1152px){.ust .wrap{max-width:min(calc(1180px + var(--ray) + var(--ray-ara)), 100%)}}
.ust-in{display:flex;align-items:center;gap:var(--sp-md);height:64px}
/* Koyu çubukta odak halkası gecenin lambası: kâğıdın --lamba-d'si burada 3,1:1. */
.ust :focus-visible{outline-color:var(--lamba)}
.marka{display:flex;align-items:center;gap:var(--sp-sm);color:var(--kagit);min-height:44px;
  font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.18em}
/* İşaret maske: beyaz PNG'nin biçimi, rengi marka metninden (currentColor).
   Böylece işaret her zaman yanındaki yazının renginde; ayrı bir koyu varlık
   gerekmiyor. */
.marka i{width:20px;height:20px;flex:none;background:currentColor;
  -webkit-mask:url(images/ai_mark.png) center/contain no-repeat;
  mask:url(images/ai_mark.png) center/contain no-repeat}
.geri{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--kagit-s);
  padding:0 var(--sp-sm);min-height:44px;display:flex;align-items:center;border-radius:var(--r-sm)}
.geri:hover{color:var(--kagit)}
/* 420px altında geri bağlantısı yalnızca oka iner; metni erişilebilir adda
   kalır. 320px'te logo, metinli bağlantı ve görünüm düğmesi 280px'e sığmıyordu. */
@media(max-width:420px){
  .geri{min-width:44px;justify-content:center;padding:0}
  .geri .ok.bas{margin-right:0}
  .geri-yazi{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);
    white-space:nowrap;letter-spacing:normal}
}
/* ---------- görünüm denetimi (dört sayfada aynı) ----------
   Dil ve tema tek düğmenin arkasında: 320px'te iki ayrı 44px düğme okuma
   sayfalarının çubuğuna sığmıyordu. Çubuğun içinde olduğu için her temada
   gece paletiyle çizilir; .menu-btn'in ve mobil menü panelinin dili.
   Betik yoksa düğme gizli kalır: yapılamayacak bir etkileşimi haber vermez. */
.ayar{position:relative;flex:none}
.ayar-btn{display:inline-flex;align-items:center;gap:var(--sp-xs);height:44px;min-width:44px;
  padding:0 var(--sp-sm);background:var(--tezgah);border:1px solid var(--hair-s);border-radius:var(--r-md);
  color:var(--kagit);font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;cursor:pointer;
  transition:background .3s,border-color .3s}
.ayar-btn[hidden]{display:none}
.ayar-btn:hover,.ayar-btn[aria-expanded="true"]{background:var(--tezgah-2);border-color:var(--hair-t)}
.ayar-ikon{width:12px;height:12px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.ayar :focus-visible{outline-color:var(--lamba)}
/* Panel çubuğun alt kenarında açılır: düğme 44px, çubuk 64px, aradaki pay 10px. */
.ayar-panel{position:absolute;top:calc(100% + 10px);right:0;z-index:50;min-width:236px;
  background:var(--tezgah);border:1px solid var(--hair-s);border-radius:var(--r-lg);padding:var(--sp-sm);
  display:flex;flex-direction:column;gap:var(--sp-sm)}
.ayar-panel[hidden],.ayar-grup[hidden]{display:none}
.ayar-ad{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--kagit-t);padding:0 var(--sp-sm);margin-bottom:var(--r-xs)}
.ayar-secenek{display:flex;gap:var(--r-xs)}
/* Seçili seçenek nav'daki etkin bağlantının dilinde: bir yüzey yukarı ve 2px
   lamba alt çizgisi. Durum yalnızca renge dayanmıyor. */
.ayar-secenek button{position:relative;flex:1 1 0;min-height:44px;min-width:44px;padding:0 var(--sp-sm);
  background:transparent;border:0;border-radius:var(--r-sm);color:var(--kagit-s);
  font-family:var(--body);font-size:15px;cursor:pointer;transition:color .3s,background .3s}
.ayar-secenek button:hover{color:var(--kagit);background:var(--tezgah-2)}
.ayar-secenek button[aria-pressed="true"]{color:var(--kagit);background:var(--tezgah-2)}
.ayar-secenek button[aria-pressed="true"]::after{content:"";position:absolute;left:var(--sp-sm);
  right:var(--sp-sm);bottom:8px;height:2px;background:var(--lamba)}
/* Tema değişirken öğeler kendi geçişleriyle farklı hızlarda renk değiştirip
   sayfayı parça parça boyamasın: tek karelik bir sınıf geçişleri bastırır.
   Hareket iptali değil; azaltılmış hareket bloğuyla ilgisi yok. */
.tema-degisiyor *,.tema-degisiyor *::before,.tema-degisiyor *::after{transition:none!important}

.kapak{padding-block:clamp(48px,8vw,80px) var(--sp-xl)}
h1{font-size:clamp(2.75rem,6.4vw,4.6rem);line-height:1.05;letter-spacing:-.02em}
/* Panelden gelen metin 200 karakterlik bölünmez tek bir dizi olabilir; bu
   satır olmadan sayfa yatayda binlerce piksel kayıyor. Kaynak, tarih, etiket
   ve görsel açıklaması da panelden geliyor ve listede yoktu: 1. sayının
   kaynağı zaten tam bir adres, uç değerlerle 320px'te sayfa 1.767px'e
   açılıyordu. index.html'deki kalıp: ızgara çocuğuna min-width:0, metne
   overflow-wrap — ikisi birlikte, biri tek başına yetmiyor. */
.sayi-bar h2,.haber h3,.ozet,.tam p,.kaynak,.etiket,.haber-tarih,.tam figcaption{overflow-wrap:anywhere}
.haber>*{min-width:0}
.giris{color:var(--metin-m);font-size:18px;line-height:1.62;max-width:58ch;margin-top:var(--sp-lg)}
.sayac{font-family:var(--mono);font-size:13px;color:var(--metin-s);margin-top:var(--sp-lg);
  padding-top:var(--sp-md);border-top:1px solid var(--cizgi)}
/* Sayaç boşken üst çizgisiyle birlikte 40px ölü boşluk bırakıyordu. */
.sayac:empty{display:none}
/* İlk istek uçuştayken alt bilgi yerleşimde yok. Masaüstünde boş listenin
   altında ilk ekranın ortasında duruyor, arşiv gelince ekrandan itiliyordu:
   ölçülen CLS 0,134 (iyi sınırı 0,1). Görünür olmayan öğe kayamaz; geri
   geldiğinde yeni öğe sayılır. Sınıfı betik koyar — betik yoksa alt bilgi
   hep görünür. */
.bekliyor footer{display:none}
/* Durum kartının altındaki çıkış satırı: hata da, betiksiz hal de buradan
   bir yere gidebilmeli. Düğmeler zaten .oku, sistemde yeni bir şey yok. */
.durum-eylem{display:flex;gap:var(--sp-sm);flex-wrap:wrap;margin-top:var(--sp-lg)}
/* Yeniden denemeden sonra odak sayaca ya da durum kartına taşınıyor. Bunlar
   etkileşimli değil; halka bir denetim varmış gibi okunurdu. */
[tabindex="-1"]:focus{outline:none}

/* Liste .wrap taşıyor; alt boşluk kimlikle veriliyor ki .wrap'in padding'i ezmesin
   (DESIGN.md, Shorthand Rule). */
#liste{padding-bottom:clamp(64px,10vw,112px)}
.sayi{margin-top:var(--sp-xxl)}
.sayi-bar{display:flex;align-items:baseline;gap:var(--sp-sm);padding-bottom:var(--sp-sm);
  border-bottom:2px solid var(--metin)}
.sayi-bar h2{font-size:28px;font-weight:400}
.sayi-bar time{font-family:var(--mono);font-size:13px;color:var(--metin-s);margin-left:auto}

.haber{display:grid;grid-template-columns:64px 1fr;gap:var(--sp-lg);padding:var(--sp-lg) 0;
  border-bottom:1px solid var(--cizgi);transition:background .3s}
.haber.acilir{cursor:pointer;margin:0 calc(var(--sp-md) * -1);padding-left:var(--sp-md);padding-right:var(--sp-md)}
.haber.acilir:hover{background:var(--yuzey)}
.haber-tarih{font-family:var(--mono);font-size:13px;color:var(--metin-s);line-height:1.7;text-align:right}
.haber-tarih b{display:block;color:var(--metin);font-weight:400;font-size:15px}
/* Panelden gelen kategori olduğu gibi basılır: dili belli değil ve lang="tr"
   altında büyük harf dönüşümü "Vision"ı "VİSİON" yapıyordu (index.html .etiket). */
.etiket{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.02em;
  color:var(--ekran-iz)}
.haber h3{font-size:28px;font-weight:400;line-height:1.28;margin-top:var(--sp-sm)}
/* Aynı kalıp: satır içi dolgu düzeni büyütmez, dokunma alanını 44px'e
   çıkarır. Buradaki kutu 28px'ti — WCAG 2.5.8 tabanını geçiyordu ama
   projenin kendi 44px kuralını geçmiyordu. */
.haber h3 a{color:var(--metin);padding-block:var(--sp-xs)}
.haber h3 a:hover{color:var(--lamba-iz)}
.ozet{color:var(--metin-m);font-size:16px;line-height:1.65;margin-top:var(--sp-sm);max-width:64ch}
/* Yer önceden ayrılmazsa tembel yüklenen görsel geldiğinde kart aşağı kayar. */
.haber img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
  border-radius:var(--r-lg);margin-top:var(--sp-md);border:1px solid transparent}
/* Kenarlık yalnızca görsel geldiğinde: yavaş ya da askıda kalan bir adres,
   ayrılmış alanı boş bir çerçeve gibi göstermesin. */
.haber img.yuklendi{border-color:var(--cizgi)}
.alt{display:flex;align-items:center;gap:var(--sp-md);flex-wrap:wrap;margin-top:var(--sp-md)}
.kaynak{font-family:var(--mono);font-size:13px;color:var(--metin-s)}
.oku,.ac{font-family:var(--body);font-size:15px;font-weight:500;color:var(--metin);
  background:none;border:1px solid var(--cizgi-s);border-radius:var(--r-md);
  padding:0 var(--sp-md);min-height:44px;display:inline-flex;align-items:center;cursor:pointer;
  transition:background .3s,border-color .3s}
.oku:hover,.ac:hover{background:var(--yuzey);border-color:var(--metin-s)}
.ac{margin-left:auto}
/* Göstergesi etkinlik satırının chevron'u: kapalıyken aşağı, açıkken yukarı. */
.ac .ok{transition:transform .45s var(--ease)}
.haber.acik .ac .ok{transform:rotate(180deg)}

.tam{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.haber.acik .tam{grid-template-rows:1fr}
/* Açık metin tıklamayla kapanmıyor; imleç de tıklanabilir olduğunu söylemesin. */
.haber.acilir .tam{cursor:auto}
/* Kırpmak yetmiyor: 0fr satırın içindeki kalıcı bağlantı yüksekliği sıfır
   olmasına rağmen odaklanabilir kalıyordu. 25 haberlik bir sayıda bu, klavye
   kullanıcısı için 25 görünmez sekme durağı demek — odak halkası hiçbir yerde
   görünmüyor (WCAG 2.4.7). Dahası odak oraya gidince overflow:hidden sarmalayıcı
   içeriden kayıyor ve kart sonradan açıldığında yazı sonundan başlıyordu.
   visibility hem sekme sırasından hem erişilebilirlik ağacından çıkarır.
   Gecikme kapanış animasyonu kadar: metin kapanırken görünür kalır, sonra gider. */
.tam>div{overflow:hidden;visibility:hidden;transition:visibility 0s .45s}
.haber.acik .tam>div{visibility:visible;transition:visibility 0s 0s}
.tam-ic{padding-top:var(--sp-lg);margin-top:var(--sp-md);border-top:1px solid var(--cizgi)}
.tam p{font-family:var(--disp);font-size:19px;line-height:1.8;color:var(--metin);
  margin-top:var(--sp-md);max-width:66ch}
.tam p:first-child{margin-top:0}
/* Metin arası görsel. Kapak görselinin 16/9 kırpması buraya UYGULANMAZ:
   ekran görüntüsü ya da tablo kırpılırsa okunmaz olur, o yüzden doğal oran.
   .haber img kuralını bastırmak için aspect-ratio açıkça sıfırlanıyor. */
.tam figure{margin-top:var(--sp-lg);max-width:66ch}
.tam figure img{aspect-ratio:auto;height:auto;object-fit:contain;margin-top:0}
.tam figcaption{font-family:var(--mono);font-size:13px;color:var(--metin-s);
  margin-top:var(--sp-xs);line-height:1.5}
.kalici{display:inline-flex;align-items:center;min-height:44px;margin-top:var(--sp-sm);
  font-family:var(--mono);font-size:13px;
  color:var(--lamba-iz);border-bottom:1px solid var(--lamba-alt);padding-bottom:3px}
@media(max-width:760px){
  .haber{grid-template-columns:1fr;gap:var(--sp-xs)}
  .haber-tarih{text-align:left;display:flex;gap:var(--sp-xs);align-items:baseline}
}

.durum{color:var(--metin-s);font-family:var(--mono);font-size:13px;line-height:1.8;
  margin-top:var(--sp-xl);padding:var(--sp-lg);border:1px solid var(--cizgi);border-radius:var(--r-lg);
  background:var(--yuzey)}
footer{border-top:1px solid var(--cizgi);padding:var(--sp-xl) 0 var(--sp-xxl)}
.foot{display:flex;gap:var(--sp-lg);flex-wrap:wrap;align-items:baseline;
  font-size:15px;color:var(--metin-s)}
.foot .sag{margin-left:auto;display:flex;gap:var(--sp-lg);flex-wrap:wrap}
/* Telefonda margin-left:auto bağlantıları ekran kenarına sıkıştırıyor ve
   kompozisyondan çok kazara bir kümelenme gibi okunuyor (index.html ile aynı). */
@media(max-width:760px){.foot .sag{margin-left:0}}
/* Satır içi dolgu yerleşimi büyütmez ama dokunma alanını 44 px kuralına çıkarır. */
.foot a{color:var(--metin-s);padding-block:var(--sp-sm)}
.foot a:hover{color:var(--metin)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  /* Toptan bir geçiş kapatması yerine yalnızca uzamsal hareket kaldırılır:
     renk ve opaklık geçişleri eylemin karşılığını gösterdiği için kalır. Açılan tam metin anında görünür.
     İptal, geçişi kuran seçicinin aynısı olmak zorunda: görünürlük gecikmesi
     .tam>div üzerinde duruyor, orada da kaldırılıyor. */
  .tam{transition:none}
  .tam>div{transition:none}
  .ac .ok{transition:none}
}
@media print{
  /* Sabit renk YOK: #fff/#000 gibi değerler dedektöre ekran değeri gibi
     görünüp belgeli cream-palette istisnasını maskeliyordu. Ama rol
     belirteçleri gündüz paletine yeniden bağlanıyor: tarayıcı zemini
     basmıyor, metni basıyor; koyu temada yazdırılan sayfa kağıda açık gri
     metinle çıkardı. Blok stil dosyasının sonunda kalmalı (DESIGN.md → Print). */
  :root{--zemin:var(--gunduz); --yuzey:var(--kart); --yuzey-2:var(--kart-2);
    --metin:var(--murekkep); --metin-m:var(--murekkep-m); --metin-s:var(--murekkep-s); --metin-t:var(--murekkep-t);
    --cizgi:rgba(26,23,19,.14); --cizgi-s:rgba(26,23,19,.24); --cizgi-t:rgba(26,23,19,.34);
    --lamba-iz:var(--lamba-d); --ekran-iz:var(--ekran-d)}
}

<script>
/*
 * Haber arşivi.
 *
 * Veri content/haberler.json'dan gelir; site de Discord botu da aynı
 * dosyayı okur. Yönetim panelinin önizlemesi bu sayfayı olduğu gibi
 * alıp window.fetch'i sarmalıyor ve "haberler.json" geçen isteğe taslağı
 * döndürüyor — bu yüzden çağrı window.fetch üzerinden ve adres bu alt
 * dizeyi içerecek şekilde kalmalı.
 *
 * Her şey textContent ile basılır: panelden gelen metin HTML olarak
 * yorumlanmaz.
 */
(function(){
  var liste = document.getElementById("liste");
  var sayac = document.getElementById("sayac");

  var AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran",
               "Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

  /* "2026-08-03" → "3 Ağustos 2026"; tanınmayan biçim olduğu gibi döner */
  function tarihYaz(s){
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!p) return s || "";
    return Number(p[3]) + " " + AYLAR[Number(p[2]) - 1] + " " + p[1];
  }

  /* Panel doğruluyor ama dosya elle de düzenlenebiliyor. Tek bir bozuk kayıt
     (null, sayı olarak tam metin) çizimi yarıda kesiyordu; hata .catch'e
     düşüp bütün arşiv "şu an yüklenemedi, bağlantın kesilmiş olabilir"
     diyordu — ağ hatası olmayan bir şeyi ağ hatası diye, üstelik hiç
     başaramayacak bir "Yeniden dene" ile. Bozuk kayıt atlanır, gerisi çizilir.
     Metin alanları metne çevrilir; bağlantı alanları href/src'ye girdiği için
     yalnızca http(s) ise kalır — "javascript:" bir bağlantı tıklanınca
     çalışırdı. */
  function metinAl(v){
    if (typeof v === "string") return v.trim();
    return typeof v === "number" ? String(v) : "";
  }
  function adres(v){
    v = metinAl(v);
    return /^https?:\/\//i.test(v) ? v : "";
  }
  function temizHaber(h){
    if (!h || typeof h !== "object") return null;
    return { etiket: metinAl(h.etiket), tarih: metinAl(h.tarih), baslik: metinAl(h.baslik),
             ozet: metinAl(h.ozet), icerik: metinAl(h.icerik), link: adres(h.link),
             gorsel: adres(h.gorsel), kaynak: metinAl(h.kaynak) };
  }
  function dizi(v){ return Array.isArray(v) ? v : []; }

  /* Sözleşmede kaynak bir ad ("Anthropic"); panel adres de kabul ediyor ve
     1. sayıda iki kaynak da tam adres. Adresin kendisi zaten "Kaynağa git"
     düğmesinde; satırda alan adı yeter. */
  function kaynakAdi(s){
    if (!/^https?:\/\//i.test(s)) return s;
    try { return new URL(s).hostname.replace(/^www\./, "") || s; }
    catch (e){ return s; }
  }

  /* Oklar sayfanın başındaki <symbol>'lerden çağrılır; ekran okuyucu görmez.
     Yeni sekmede açılan bağlantı bunu sözle söyler, ok yerine. */
  function ikon(ad, bas){
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", bas ? "ok bas" : "ok");
    svg.setAttribute("aria-hidden", "true");
    var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#" + ad);
    svg.appendChild(use);
    return svg;
  }
  function yeniSekme(a){
    var g = document.createElement("span");
    g.className = "gizli";
    g.textContent = " (yeni sekmede açılır)";
    a.appendChild(g);
  }

  /* Bekleme her çıkışta biter: arşiv, boş arşiv ya da hata. */
  function bitti(){ document.body.classList.remove("bekliyor"); }

  function durum(metin){
    bitti();
    var p = document.createElement("p");
    p.className = "durum";
    p.textContent = metin;
    liste.appendChild(p);
    return p;
  }

  /* "Yeniden dene"ye basan kişinin odağı, düğme silindiğinde <body>'ye
     düşüyordu; klavye ve ekran okuyucu kullanıcısı denemenin sonucunu hiç
     duymuyordu. Sonuç çizilince odak oraya taşınır. */
  var odakIste = false;
  function odakla(el){
    if (!odakIste || !el) return;
    odakIste = false;
    if (!el.matches("a[href],button")) el.tabIndex = -1;
    el.focus();
  }

  function ayrintiAdresi(h, sayiNo, sira){
    if (!h.icerik) return "";
    return "haber.html?sayi=" + encodeURIComponent(sayiNo) + "&sira=" + sira;
  }

  /* Tek başına bir satırda duran adres = metin arası görsel.
   *
   * Uzantıya BAKMIYORUZ, bilerek: panelden gelen adreslerin bir kısmının
   * yolunda uzantı yok (ör. pbs.twimg.com/media/…?format=png). Görseli
   * çizmeyi deniyoruz; yüklenemezse aşağıdaki onerror figürü bağlantı
   * paragrafına çeviriyor, yani yanılma bedeli kırık ikon değil tıklanabilir
   * bir adres. Aynı kuralın kopyaları: haber.html, scripts/discord-gonder.js
   * ve paneldeki src/lib/site/news.ts (icerikBloklari). */
  var TEK_ADRES = /^https?:\/\/\S+$/;

  function gorselFigur(src, aciklama){
    var fig = document.createElement("figure");
    var img = document.createElement("img");
    img.src = src;
    img.alt = aciklama || "";
    img.loading = "lazy";
    img.onload = function(){ this.classList.add("yuklendi"); };
    /* Adres ölmüş ya da görsel değilse metnin akışı bozulmasın: figürün
       yerine okurun nereye gittiğini gördüğü bir bağlantı koyuyoruz. */
    img.onerror = function(){
      var p = document.createElement("p");
      var a = document.createElement("a");
      a.href = src;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = aciklama || src;
      yeniSekme(a);
      p.appendChild(a);
      if (fig.parentNode) fig.parentNode.replaceChild(p, fig);
    };
    fig.appendChild(img);
    if (aciklama){
      var yazi = document.createElement("figcaption");
      yazi.textContent = aciklama;
      fig.appendChild(yazi);
    }
    return fig;
  }

  /* Tam metni bloklara böler: boş satır ayırır, tek satır sonu ayırmaz.
     İlk satırı tek başına adres olan blok görsel olur, bloğun kalanı da
     görselin açıklaması. */
  function paragraflar(metin){
    var kap = document.createDocumentFragment();
    (metin || "").split(/\n\s*\n/).forEach(function(parca){
      var t = parca.replace(/\s+$/, "");
      if (!t) return;
      var satirlar = t.split("\n");
      var ilk = satirlar[0].trim();
      if (TEK_ADRES.test(ilk)){
        kap.appendChild(gorselFigur(ilk, satirlar.slice(1).join("\n").trim()));
        return;
      }
      var p = document.createElement("p");
      p.textContent = t;
      kap.appendChild(p);
    });
    return kap;
  }

  function haberKarti(h, sayiNo, sira){
    var ayrinti = ayrintiAdresi(h, sayiNo, sira);
    /* Düğme ile açtığı bölgeyi bağlayan kimlik. Sayı + sıra zaten benzersiz. */
    var tamId = "tam-" + sayiNo + "-" + sira;
    var art = document.createElement("article");
    art.className = ayrinti ? "haber acilir" : "haber";

    var tarih = document.createElement("div");
    tarih.className = "haber-tarih";
    if (h.tarih){
      var parcalar = h.tarih.split(/\s+/);
      var gun = document.createElement("b");
      gun.textContent = parcalar[0] || "";
      tarih.appendChild(gun);
      tarih.appendChild(document.createTextNode(parcalar.slice(1).join(" ")));
    }
    art.appendChild(tarih);

    var ic = document.createElement("div");

    if (h.etiket){
      var et = document.createElement("span");
      et.className = "etiket";
      et.textContent = h.etiket;
      ic.appendChild(et);
    }

    /* Tam metni olan haberde başlık bağlantı değil: karta tıklamak metni
       yerinde açıyor. Tam metin yoksa başlık doğrudan kaynağa gider. */
    var h3 = document.createElement("h3");
    if (ayrinti){
      h3.textContent = h.baslik || "";
    } else if (h.link){
      var a = document.createElement("a");
      a.href = h.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = h.baslik || "";
      yeniSekme(a);
      h3.appendChild(a);
    } else {
      h3.textContent = h.baslik || "";
    }
    ic.appendChild(h3);

    if (h.ozet){
      var p = document.createElement("p");
      p.className = "ozet";
      p.textContent = h.ozet;
      ic.appendChild(p);
    }

    if (h.gorsel){
      var img = document.createElement("img");
      img.src = h.gorsel;
      img.alt = "";
      img.loading = "lazy";
      /* Görsel adresi de panelden gelir ve bozuk olabilir; kırık ikon
         bırakmaktansa görseli kaldırıyoruz. */
      img.onload = function(){ this.classList.add("yuklendi"); };
      img.onerror = function(){ if (this.parentNode) this.parentNode.removeChild(this); };
      ic.appendChild(img);
    }

    if (h.kaynak || h.link || ayrinti){
      var alt = document.createElement("div");
      alt.className = "alt";
      if (h.kaynak){
        var k = document.createElement("span");
        k.className = "kaynak";
        k.textContent = "Kaynak: " + kaynakAdi(h.kaynak);
        alt.appendChild(k);
      }
      if (h.link){
        var oku = document.createElement("a");
        oku.className = "oku";
        oku.href = h.link;
        oku.target = "_blank";
        oku.rel = "noopener noreferrer";
        oku.textContent = "Kaynağa git";
        oku.appendChild(ikon("i-dis"));
        yeniSekme(oku);
        alt.appendChild(oku);
      }
      if (ayrinti){
        var dugme = document.createElement("button");
        dugme.type = "button";
        dugme.className = "ac";
        var dugmeYazi = document.createElement("span");
        dugmeYazi.textContent = "Devamını oku";
        dugme.appendChild(dugmeYazi);
        dugme.appendChild(ikon("i-asagi"));
        dugme.setAttribute("aria-expanded", "false");
        dugme.setAttribute("aria-controls", tamId);
        alt.appendChild(dugme);
      }
      ic.appendChild(alt);
    }

    if (ayrinti){
      var tam = document.createElement("div");
      tam.className = "tam";
      tam.id = tamId;
      var sar = document.createElement("div");
      var icerik = document.createElement("div");
      icerik.className = "tam-ic";
      icerik.appendChild(paragraflar(h.icerik));

      var kalici = document.createElement("a");
      kalici.className = "kalici";
      kalici.href = ayrinti;
      kalici.textContent = "Haberi kendi sayfasında aç";
      kalici.appendChild(ikon("i-ileri"));
      icerik.appendChild(kalici);

      sar.appendChild(icerik);
      tam.appendChild(sar);
      ic.appendChild(tam);

      /* Tek dinleyici kartta: düğmeye tıklamak da buraya kabarıyor.
         Bağlantılar hariç tutuluyor, yoksa yeni sekme açarken kart da
         açılıp kapanıyordu. */
      art.addEventListener("click", function(olay){
        if (olay.target.closest("a")) return;
        /* Düğme her zaman çalışır; klavyeden gelen Enter/Boşluk da buraya
           düşüyor. Kartın geri kalanı yalnızca okumayı bozmuyorsa çalışır. */
        if (!olay.target.closest(".ac")){
          /* Açık tam metin bir okuma yüzeyi, tetik değil. Eskiden paragrafa
             ya da metin arası görsele tıklamak kartı kapatıyordu: okur
             yazının ortasında yerini kaybediyor, sayfa yüzlerce piksel
             kısalıyordu. Telefonda metne dokunmak da aynı şeyi yapıyordu. */
          if (olay.target.closest(".tam")) return;
          /* Aynı öğe içinde sürükleyerek metin seçmek de click üretiyor;
             başlığı ya da özeti kopyalamak isteyen kartı açıp kapatmasın. */
          var secim = window.getSelection && window.getSelection();
          if (secim && !secim.isCollapsed && art.contains(secim.anchorNode)) return;
        }
        var acik = art.classList.toggle("acik");
        var d = art.querySelector(".ac");
        if (d){
          d.querySelector("span").textContent = acik ? "Kapat" : "Devamını oku";
          d.setAttribute("aria-expanded", acik ? "true" : "false");
        }
      });
    }

    art.appendChild(ic);
    return art;
  }

  function sayiBolumu(sayi){
    var sec = document.createElement("section");
    sec.className = "sayi";

    var bar = document.createElement("div");
    bar.className = "sayi-bar";

    var h2 = document.createElement("h2");
    h2.textContent = sayi.sayi + ". sayı";
    bar.appendChild(h2);

    var t = document.createElement("time");
    /* Sayı tarihi sözleşmede ISO ("2026-08-03"); <time> makine okunur
       değerini taşısın. Biçim tanınmıyorsa datetime hiç yazılmaz —
       uydurulmuş bir tarih boş bırakmaktan kötüdür. */
    if (/^\d{4}-\d{2}-\d{2}$/.test(sayi.tarih || "")) t.dateTime = sayi.tarih;
    t.textContent = tarihYaz(sayi.tarih);
    bar.appendChild(t);

    sec.appendChild(bar);
    /* Sıra, atlanan bozuk kayıtlar dahil özgün dizindeki sıradır: ayrıntı
       adresi (?sira=) ve Discord'daki eski bağlantılar ona dayanıyor. */
    dizi(sayi.haberler).forEach(function(ham, i){
      var h = temizHaber(ham);
      if (h) sec.appendChild(haberKarti(h, sayi.sayi, i));
    });
    return sec;
  }

  if (!window.fetch){
    sayac.textContent = "";
    durum("Tarayıcın bu sayfayı desteklemiyor. Güncel bir tarayıcıyla açmayı dene.");
    return;
  }

  /* Ağ hatası boş arşivden ayrı bir durum ve ayrı bir cümle hak ediyor.
     Eskiden buradaki tek cümle ziyaretçiye yerel bir HTTP sunucusu kurmasını
     söylüyordu — geliştirici talimatıydı, üstelik sayfada tıklanacak hiçbir
     şey bırakmıyordu. index.html aynı dosyayı okuyor ve bunu doğru yapıyor;
     kalıp oradan geliyor. */
  function hataGoster(){
    sayac.textContent = "";
    liste.textContent = "";
    durum("Arşiv şu an yüklenemedi. İnternet bağlantın kesilmiş ya da çok yavaş olabilir.");
    var eylem = document.createElement("p");
    eylem.className = "durum-eylem";
    var tekrar = document.createElement("button");
    tekrar.type = "button";
    tekrar.className = "oku";
    tekrar.textContent = "Yeniden dene";
    /* disabled değil aria-disabled: devre dışı kalan düğme odağı bırakıyor.
       Deneme sürerken kart yerinde kalır, düğme ne olduğunu söyler. */
    tekrar.addEventListener("click", function(){
      if (istekVar) return;
      tekrar.setAttribute("aria-disabled", "true");
      tekrar.textContent = "Deneniyor…";
      odakIste = true;
      getir(true);
    });
    eylem.appendChild(tekrar);
    var ana = document.createElement("a");
    ana.className = "oku";
    ana.href = "index.html";
    ana.appendChild(ikon("i-geri", true));
    ana.appendChild(document.createTextNode("Ana sayfa"));
    eylem.appendChild(ana);
    liste.appendChild(eylem);
    odakla(tekrar);
  }

  /* Uçuştaki istek varken ikinci dokunuş satırları üst üste bindirmesin.

     Askıda kalan istek: bağlantı kopmadan donan bir ağda (kampüs Wi-Fi'ı,
     telefonda zayıf çekim) "Arşiv yükleniyor…" sonsuza kadar ekranda
     kalıyordu ve sayfada tıklanacak hiçbir şey yoktu. Yanıtın ilk baytı
     ZAMAN_ASIMI içinde gelmezse hata durumu çizilir. fetch çağrısına
     AbortSignal verilmiyor, bilerek: panelin önizlemesi window.fetch'i
     sarmalıyor ve ikinci argümanı nasıl ele aldığını bu depodan göremiyoruz.
     İstek iptal edilmediği için geç gelen yanıt yine de çizilir; sonIstek
     yalnızca yerini yeni bir denemeye bırakmış eski isteği susturur. */
  var ZAMAN_ASIMI = 10000;
  var istekVar = false, sonIstek = 0;
  function getir(yeniden){
    if (istekVar) return;
    istekVar = true;
    var no = ++sonIstek, dustu = false;
    if (!yeniden){
      liste.textContent = "";
      sayac.textContent = "Arşiv yükleniyor…";
      document.body.classList.add("bekliyor");
    }
    var sure = setTimeout(function(){
      if (no !== sonIstek) return;
      dustu = true; istekVar = false; hataGoster();
    }, ZAMAN_ASIMI);

    fetch("content/haberler.json", { cache: "no-cache" })
    .then(function(r){ clearTimeout(sure); if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      if (no !== sonIstek) return;
      istekVar = false;
      liste.textContent = "";
      var sayilar = dizi(d && d.sayilar).filter(function(s){ return s && typeof s === "object"; });
      if (!sayilar.length){
        sayac.textContent = "";
        odakla(durum("Henüz yayımlanmış bir sayı yok."));
        return;
      }

      var toplam = 0;
      sayilar.forEach(function(s){ toplam += dizi(s.haberler).filter(temizHaber).length; });
      sayac.textContent = sayilar.length + " sayı · " + toplam + " haber · en yenisi " +
                          tarihYaz(sayilar[0].tarih);

      sayilar.forEach(function(s){ liste.appendChild(sayiBolumu(s)); });
      bitti();
      odakla(sayac);
    })
    .catch(function(){
      clearTimeout(sure);
      if (no !== sonIstek || dustu) return;
      istekVar = false; hataGoster();
    });
  }

  getir();
})();
</script>
<script>
/* ============================================================
   Görünüm denetimi (dört sayfada aynı: index, haberler, haber, katil)

   Tema canlı değişir: <html data-tema> ve kayıt. "Sistem" niteliği ve
   kaydı kaldırır; CSS o zaman prefers-color-scheme'i izler. Dil değişince
   sayfa yeniden yüklenir: her sayfanın betiği metnini tek dilde üretiyor,
   açık kart ve odak gibi durumları canlı yeniden çizmek yerine yükleme
   temiz bir sayfa veriyor. Odak yüklemeden sonra düğmeye döner, kaydırma
   konumunu tarayıcı korur. Depo kullanılamıyorsa (panelin önizlemesi)
   tema oturum boyunca çalışır, dil satırı gizlenir: yükleme seçimi
   taşıyamaz.
   ============================================================ */
(function(){
  "use strict";
  var h = document.documentElement;
  var btn = document.getElementById("ayarBtn");
  var panel = document.getElementById("ayarPanel");
  if (!btn || !panel) return;
  var kutu = btn.parentNode;
  var TEMA = "atilimai.tema", DIL = "atilimai.dil", ODAK = "atilimai.odak";
  var acikSistem = window.matchMedia("(prefers-color-scheme: light)");

  function al(k){ try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function yaz(k, v){ try { if (v === null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  var depoVar = yaz("atilimai.deneme", "1") && yaz("atilimai.deneme", null);

  function secim(){ var t = h.getAttribute("data-tema"); return t === "koyu" || t === "acik" ? t : "sistem"; }
  function etkin(){ var t = secim(); return t === "sistem" ? (acikSistem.matches ? "acik" : "koyu") : t; }
  var dil = h.lang === "en" ? "en" : "tr";

  function guncelle(){
    btn.querySelector(".ayar-kod").textContent = dil.toUpperCase();
    btn.querySelector("use").setAttribute("href", etkin() === "acik" ? "#i-gunes" : "#i-ay");
    var t = secim();
    [].forEach.call(panel.querySelectorAll("[data-tema-sec]"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-tema-sec") === t ? "true" : "false"); });
    [].forEach.call(panel.querySelectorAll("[data-dil-sec]"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-dil-sec") === dil ? "true" : "false"); });
  }
  function haberVer(){
    var e; try { e = new CustomEvent("temadegisti"); } catch (x) { e = document.createEvent("Event"); e.initEvent("temadegisti", false, false); }
    document.dispatchEvent(e);
  }
  function temaUygula(t){
    h.classList.add("tema-degisiyor");
    if (t === "sistem") h.removeAttribute("data-tema"); else h.setAttribute("data-tema", t);
    yaz(TEMA, t === "sistem" ? null : t);
    guncelle();
    void getComputedStyle(document.body).backgroundColor;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ h.classList.remove("tema-degisiyor"); }); });
    haberVer();
  }
  function ac(){ panel.hidden = false; btn.setAttribute("aria-expanded", "true"); }
  function kapat(odakla){
    if (panel.hidden) return;
    panel.hidden = true; btn.setAttribute("aria-expanded", "false");
    if (odakla) btn.focus();
  }

  btn.addEventListener("click", function(){ if (panel.hidden) ac(); else kapat(false); });
  panel.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button") : null;
    if (!b) return;
    var t = b.getAttribute("data-tema-sec"), d = b.getAttribute("data-dil-sec");
    if (t) temaUygula(t);
    if (d && d !== dil && yaz(DIL, d === "en" ? "en" : null)) {
      try { window.sessionStorage.setItem(ODAK, "ayar"); } catch (x) {}
      window.location.reload();
    }
  });
  /* Dışarı dokunmak kapatır (ana sayfada mobil menü de aynı kuralla kapanıyor,
     ikisi birbirini kendiliğinden kapatır). Escape kapatıp odağı düğmeye verir.
     Odak denetimden çıkınca kapanır; relatedTarget yoksa (Safari düğmeye
     tıklayınca odağı taşımıyor) karar dışarı dokunmaya kalır. */
  document.addEventListener("click", function(e){ if (!kutu.contains(e.target)) kapat(false); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && !panel.hidden) kapat(true); });
  kutu.addEventListener("focusout", function(e){ if (e.relatedTarget && !kutu.contains(e.relatedTarget)) kapat(false); });
  var dinle = function(){ guncelle(); if (secim() === "sistem") haberVer(); };
  if (acikSistem.addEventListener) acikSistem.addEventListener("change", dinle); else acikSistem.addListener(dinle);

  if (!depoVar) document.getElementById("ayarDil").hidden = true;
  guncelle();
  btn.hidden = false;
  try { if (window.sessionStorage.getItem(ODAK) === "ayar") { window.sessionStorage.removeItem(ODAK); btn.focus(); } } catch (x) {}
})();
</script>
</body>
