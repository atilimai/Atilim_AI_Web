<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haber — Atılım AI</title>
<meta name="description" content="Atılım AI haftalık raporundan bir haberin tam metni.">
<meta name="theme-color" content="#100D0A">
<meta property="og:type" content="article">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=Public+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Gündüz dünyası — DESIGN.md. Uzun metin karanlık zeminde okunmuyor. */
:root{
  --gece:#100D0A; --hair-d:rgba(240,234,221,.13);
  --kagit:#F0EADD; --kagit-s:#A69C8C;
  --gunduz:#F2EDE3; --kart:#FBF8F1;
  --murekkep:#1A1713; --murekkep-m:#4A443B; --murekkep-s:#6B6357;
  --cizgi:rgba(26,23,19,.14); --cizgi-s:rgba(26,23,19,.24);
  --lamba:#E8A33D; --lamba-d:#8A5510; --ekran-d:#3D6389;
  --disp:"Newsreader",Georgia,serif;
  --body:"Public Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px;
  --sp-xs:8px; --sp-sm:12px; --sp-md:16px; --sp-lg:24px; --sp-xl:32px; --sp-xxl:48px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--gunduz);color:var(--murekkep);font-family:var(--body);
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:300}
a{color:var(--lamba-d);text-decoration:none}
:focus-visible{outline:2px solid var(--lamba-d);outline-offset:3px;border-radius:var(--r-xs)}
.wrap{max-width:840px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}
.mono{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
.meta{font-family:var(--mono);font-size:13px;color:var(--murekkep-s)}
.num{font-variant-numeric:tabular-nums}

.atla{position:absolute;left:-9999px;top:0;z-index:100;background:var(--murekkep);color:var(--gunduz);
  font-weight:500;padding:12px 20px;border-radius:var(--r-md)}
.atla:focus{left:20px;top:14px}

/* Üst bar karanlık kalır: odadan çıkıp defteri açma anı. */
.ust{background:var(--gece);border-bottom:1px solid var(--hair-d)}
.ust-in{display:flex;align-items:center;gap:var(--sp-md);height:60px}
.marka{display:flex;align-items:center;gap:11px;color:var(--kagit);
  font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.18em}
.marka i{width:14px;height:14px;border:1px solid var(--lamba);flex:none;
  display:flex;align-items:center;justify-content:center}
.marka i::after{content:"";width:5px;height:5px;background:var(--lamba)}
.geri{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--kagit-s);
  padding:0 var(--sp-sm);min-height:44px;display:flex;align-items:center;border-radius:var(--r-sm)}
.geri:hover{color:var(--kagit)}

.kapak{padding:clamp(48px,8vw,80px) 0 var(--sp-xl)}
h1{font-size:clamp(2.75rem,6.4vw,4.6rem);line-height:1.05;letter-spacing:-.02em}
.giris{color:var(--murekkep-m);font-size:18px;line-height:1.62;max-width:58ch;margin-top:20px}
.sayac{font-family:var(--mono);font-size:13px;color:var(--murekkep-s);margin-top:var(--sp-lg);
  padding-top:var(--sp-md);border-top:1px solid var(--cizgi)}

main{padding-bottom:clamp(64px,10vw,112px)}

.etiket{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ekran-d)}
.alt{display:flex;align-items:center;gap:var(--sp-md);flex-wrap:wrap;margin-top:var(--sp-md)}
.kaynak{font-family:var(--mono);font-size:13px;color:var(--murekkep-s)}
.oku,.ac{font-family:var(--body);font-size:15px;font-weight:500;color:var(--murekkep);
  background:none;border:1px solid var(--cizgi-s);border-radius:var(--r-md);
  padding:0 var(--sp-md);min-height:44px;display:inline-flex;align-items:center;cursor:pointer;
  transition:background .3s,border-color .3s}
.oku:hover,.ac:hover{background:var(--kart);border-color:var(--murekkep-s)}
.ac{margin-left:auto}

  .haber-tarih{text-align:left;display:flex;gap:var(--sp-xs);align-items:baseline}
}

.durum{color:var(--murekkep-s);font-family:var(--mono);font-size:13px;line-height:1.8;
  margin-top:var(--sp-xl);padding:var(--sp-lg);border:1px solid var(--cizgi);border-radius:var(--r-lg);
  background:var(--kart)}
footer{border-top:1px solid var(--cizgi);padding:var(--sp-xl) 0 var(--sp-xxl)}
.foot{display:flex;gap:var(--sp-lg);flex-wrap:wrap;align-items:baseline;
  font-size:15px;color:var(--murekkep-s)}
.foot .sag{margin-left:auto;display:flex;gap:20px}
.foot a{color:var(--murekkep-s)}
.foot a:hover{color:var(--murekkep)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition-duration:.01ms!important}
}

/* ---------- okuma sayfası ---------- */
.kapak-ust{display:flex;align-items:center;gap:var(--sp-sm);flex-wrap:wrap;margin-bottom:var(--sp-md)}
.etiket{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ekran-d)}
.kapak-ust time{font-family:var(--mono);font-size:13px;color:var(--murekkep-s)}
.yazi{margin-top:var(--sp-xl)}
.yazi img.gorsel{width:100%;max-height:400px;object-fit:cover;display:block;
  border:1px solid var(--cizgi);border-radius:var(--r-lg);margin-bottom:var(--sp-xl)}
.yazi p{font-family:var(--disp);font-size:19px;line-height:1.85;color:var(--murekkep);
  margin-top:var(--sp-lg);max-width:66ch}
.yazi p:first-of-type{margin-top:0}
.yazi-alt{display:flex;align-items:center;gap:var(--sp-md);flex-wrap:wrap;
  margin-top:var(--sp-xxl);padding-top:var(--sp-lg);border-top:1px solid var(--cizgi)}
.alt{display:flex;align-items:center;gap:var(--sp-md);flex-wrap:wrap;margin-top:var(--sp-lg)}
.kaynak{font-family:var(--mono);font-size:13px;color:var(--murekkep-s)}
.oku{font-family:var(--body);font-size:15px;font-weight:500;color:var(--murekkep);
  background:none;border:1px solid var(--cizgi-s);border-radius:var(--r-md);
  padding:0 var(--sp-md);min-height:44px;display:inline-flex;align-items:center;
  transition:background .3s,border-color .3s}
.oku:hover{background:var(--kart);border-color:var(--murekkep-s)}
</style>
</head>
<body>

<a class="atla" href="#govde">İçeriğe atla</a>

<nav class="ust"><div class="wrap ust-in">
  <a class="marka" href="index.html"><i aria-hidden="true"></i>ATILIM AI</a>
  <a class="geri" href="haberler.html">← Haberler</a>
</div></nav>

<header class="kapak wrap" id="kapak" hidden>
  <div class="kapak-ust" id="kapakUst"></div>
  <h1 id="baslik"></h1>
  <p class="giris" id="ozet"></p>
  <p class="sayac" id="kapakMeta"></p>
</header>

<main class="wrap" id="govde"></main>

<footer><div class="wrap foot">
  <span>Atılım AI · Ankara</span>
  <span class="sag">
    <a href="haberler.html">Haberler</a>
    <a href="index.html">Ana sayfa</a>
    <a href="https://discord.gg/uUzsA7uDzU" target="_blank" rel="noopener">Discord</a>
  </span>
</div></footer>

<script>
/*
 * Bir haberin tam metni.
 *
 * Adres: haber.html?sayi=12&sira=0 — sayı numarası ve o sayı içindeki sıra.
 * Discord botu da (scripts/discord-gonder.js) aynı şemayla link üretiyor,
 * bu yüzden adres biçimi değiştirilemez.
 *
 * Her şey textContent ile basılır: panelden gelen metin HTML olarak
 * yorumlanmaz.
 */
(function(){
  var kapak    = document.getElementById("kapak");
  var kapakUst = document.getElementById("kapakUst");
  var govde    = document.getElementById("govde");

  var AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran",
               "Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

  function tarihYaz(s){
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    if (!p) return s || "";
    return Number(p[3]) + " " + AYLAR[Number(p[2]) - 1] + " " + p[1];
  }

  function durum(metin){
    var p = document.createElement("p");
    p.className = "durum";
    p.textContent = metin;
    govde.appendChild(p);
    var sar = document.createElement("p");
    sar.style.marginTop = "24px";
    var link = document.createElement("a");
    link.className = "oku";
    link.href = "haberler.html";
    link.textContent = "← Bütün haberler";
    sar.appendChild(link);
    govde.appendChild(sar);
  }

  var q = new URLSearchParams(location.search);
  var sayiNo = Number(q.get("sayi"));
  var sira   = Number(q.get("sira"));

  if (!Number.isInteger(sayiNo) || !Number.isInteger(sira) || sira < 0){
    durum("Adres eksik ya da bozuk. Haberi haberler sayfasından açın.");
    return;
  }

  function ciz(sayi, h){
    document.title = (h.baslik || "Haber") + " — Atılım AI";

    if (h.etiket){
      var et = document.createElement("span");
      et.className = "etiket";
      et.textContent = h.etiket;
      kapakUst.appendChild(et);
    }
    if (h.tarih){
      var tm = document.createElement("time");
      tm.textContent = h.tarih;
      kapakUst.appendChild(tm);
    }

    document.getElementById("baslik").textContent = h.baslik || "";

    var ozet = document.getElementById("ozet");
    if (h.ozet) ozet.textContent = h.ozet; else ozet.remove();

    document.getElementById("kapakMeta").textContent =
      sayi.sayi + ". sayı · " + tarihYaz(sayi.tarih) + (h.kaynak ? " · " + h.kaynak : "");

    kapak.hidden = false;

    var yazi = document.createElement("article");
    yazi.className = "yazi";

    if (h.gorsel){
      var img = document.createElement("img");
      img.className = "gorsel";
      img.src = h.gorsel;
      img.alt = "";
      yazi.appendChild(img);
    }

    /* Boş satır paragrafı ayırır; tek satır sonları paragraf içinde kalır. */
    (h.icerik || "").split(/\n\s*\n/).forEach(function(parca){
      var metin = parca.replace(/\s+$/, "");
      if (!metin) return;
      var p = document.createElement("p");
      p.textContent = metin;
      yazi.appendChild(p);
    });

    var alt = document.createElement("div");
    alt.className = "yazi-alt";
    if (h.kaynak){
      var k = document.createElement("span");
      k.className = "kaynak";
      k.textContent = "Kaynak: " + h.kaynak;
      alt.appendChild(k);
    }
    if (h.link){
      var oku = document.createElement("a");
      oku.className = "oku";
      oku.href = h.link;
      oku.target = "_blank";
      oku.rel = "noopener noreferrer";
      oku.textContent = "Kaynağa git ↗";
      alt.appendChild(oku);
    }
    var geri = document.createElement("a");
    geri.className = "oku";
    geri.href = "haberler.html";
    geri.textContent = "← Bütün haberler";
    geri.style.marginLeft = "auto";
    alt.appendChild(geri);
    yazi.appendChild(alt);

    govde.appendChild(yazi);
  }

  fetch("content/haberler.json", { cache: "no-cache" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      var sayilar = (d && d.sayilar) || [];
      var sayi = null;
      for (var i = 0; i < sayilar.length; i++){
        if (Number(sayilar[i].sayi) === sayiNo){ sayi = sayilar[i]; break; }
      }
      var h = sayi && (sayi.haberler || [])[sira];
      if (!h){
        durum("Bu haber bulunamadı. Sayı düzenlenmiş ve haberin sırası değişmiş olabilir.");
        return;
      }
      if (!h.icerik){
        durum("Bu haberin tam metni yok; özeti haberler sayfasında duruyor.");
        return;
      }
      ciz(sayi, h);
    })
    .catch(function(){
      durum("Haber yüklenemedi. Bu sayfa haberleri content/haberler.json dosyasından okur; " +
            "dosyayı doğrudan açmak yerine yerel bir sunucu (http://) üzerinden açmanız gerekir.");
    });
})();
</script>
</body>
</html>
